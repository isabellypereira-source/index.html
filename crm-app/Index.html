<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<base target="_top">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--verde:#1E5E4A;--verde2:#2E7D5F;--lima:#A5C93A;--laranja:#F2572B;--creme:#FFF6E9;--linha:#EADFCB;--cinza:#6B6B6B;--txt:#1d2b25;--branco:#fff;--verm:#E5484D;--amar:#F2C94C;--azul:#4A7BF7}
*{box-sizing:border-box}
body{margin:0;font-family:Montserrat,Arial,sans-serif;background:var(--creme);color:var(--txt);font-size:14px}
header{background:var(--verde);color:#fff;display:flex;align-items:center;gap:16px;padding:10px 20px;position:sticky;top:0;z-index:20;flex-wrap:wrap}
header .logo{font-weight:700;font-size:18px;letter-spacing:.3px}
header .logo span{color:var(--lima)}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{background:transparent;border:0;color:#CFE3D6;font:600 13px Montserrat;padding:8px 12px;border-radius:8px;cursor:pointer;position:relative}
nav button.on{background:rgba(255,255,255,.14);color:#fff}
nav .badge{background:var(--laranja);color:#fff;border-radius:10px;padding:1px 6px;font-size:10px;margin-left:4px}
.qr-wrap{margin-bottom:2px}
.qr-row{display:flex;gap:4px;flex-wrap:wrap;padding:4px 2px 10px}
.qr-btn{border:1px solid var(--linha);background:#fff;border-radius:14px;padding:5px 10px;font:600 11px Montserrat;cursor:pointer;color:var(--txt)}
.qr-btn:active{background:var(--creme)}
@media(max-width:700px){.qr-btn{font-size:12px;padding:7px 11px}}
header .me{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:14px;font-weight:700}
header select{font:700 15px Montserrat;border-radius:22px;border:2px solid #fff;padding:8px 14px;background:var(--lima);color:var(--verde);min-width:170px;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.2)}header select.vazio{background:var(--laranja);color:#fff;animation:pulse 1.5s infinite}@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(242,87,43,.35)}}
main{padding:18px 20px;max-width:1600px;margin:0 auto}
h2{margin:6px 0 14px;color:var(--verde);font-size:18px}
h3{margin:0 0 10px;color:var(--laranja);font-size:13px;text-transform:uppercase;letter-spacing:.5px}
.row{display:flex;gap:14px;flex-wrap:wrap}
.card{background:#fff;border-radius:12px;padding:14px 16px;box-shadow:0 1px 0 var(--linha);border:1px solid var(--linha)}
.kpi{flex:1;min-width:160px}
.kpi .l{font-size:11px;color:var(--cinza);font-weight:700;text-transform:uppercase}
.kpi .v{font-size:28px;font-weight:700;color:var(--verde);margin-top:4px}
.kpi .s{font-size:11px;color:var(--cinza);margin-top:2px}
.btn{background:var(--verde);color:#fff;border:0;border-radius:8px;padding:8px 14px;font:600 13px Montserrat;cursor:pointer}
.btn.sec{background:#fff;color:var(--verde);border:1px solid var(--verde)}
.btn.lar{background:var(--laranja)}
.btn.sm{padding:5px 10px;font-size:12px}
.btn:disabled{opacity:.5}
input,select,textarea{font:500 13px Montserrat;border:1px solid #d9cfbd;border-radius:8px;padding:7px 9px;background:#fff;color:var(--txt)}
textarea{width:100%;min-height:70px;resize:vertical}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
/* kanban */
.board{display:flex;gap:12px;overflow-x:auto;padding-bottom:10px;align-items:flex-start}
.col{background:#F4EBDA;border-radius:12px;min-width:250px;width:250px;flex-shrink:0;display:flex;flex-direction:column;max-height:calc(100vh - 190px)}
.col .hd{padding:10px 12px;font-weight:700;font-size:13px;display:flex;justify-content:space-between;border-top:4px solid var(--c);border-radius:12px 12px 0 0}
.col .hd small{color:var(--cinza);font-weight:600}
.col .bd{padding:6px 8px 10px;overflow-y:auto;flex:1;min-height:60px}
.col.over{outline:2px dashed var(--verde)}
.lc{background:#fff;border-radius:10px;padding:9px 10px;margin-bottom:8px;cursor:pointer;border:1px solid var(--linha);box-shadow:0 1px 2px rgba(0,0,0,.04)}
.lc:hover{border-color:var(--verde)}
.lc.venc{border-left:3px solid var(--verm);background:#FFF8F8}
.lc .n{font-weight:700;font-size:13px}
.lc .m{font-size:11px;color:var(--cinza);margin-top:3px}
.lc .f{display:flex;justify-content:space-between;align-items:center;margin-top:6px;font-size:11px}
.av{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:var(--lima);color:var(--verde);font-weight:700;font-size:10px}
.tag{display:inline-block;padding:2px 7px;border-radius:10px;font-size:10px;font-weight:700;background:#EEF5DC;color:var(--verde)}
.tag.red{background:#F8D7DA;color:#a61b22}.tag.yel{background:#FFF3CD;color:#7a5b00}.tag.blue{background:#E3E8FF;color:#2849b8}.tag.gray{background:#eee;color:#555}
/* tabela */
table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden}
th{background:var(--verde);color:#fff;text-align:left;font-size:12px;padding:8px;position:sticky;top:0}
td{border-bottom:1px solid var(--linha);padding:7px 8px;font-size:13px;vertical-align:top}
tr.click:hover td{background:#FBF7EE;cursor:pointer}
/* drawer */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:40;display:none}
.drawer{position:fixed;right:0;top:0;bottom:0;width:min(560px,100%);background:#fff;z-index:50;box-shadow:-4px 0 20px rgba(0,0,0,.15);transform:translateX(100%);transition:.2s;display:flex;flex-direction:column}
.drawer.open{transform:none}.ov.open{display:block}
.drawer .top{background:var(--verde);color:#fff;padding:14px 18px}
.drawer .top h2{color:#fff;margin:0 0 4px}
.drawer .body{padding:14px 18px;overflow-y:auto;flex:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px}
.grid2 label{font-size:11px;font-weight:700;color:var(--cinza);display:flex;flex-direction:column;gap:3px}
.grid2 .full{grid-column:1/3}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.acts a{text-decoration:none}
.tl{border-left:2px solid var(--linha);margin-left:6px;padding-left:12px}
.tl .it{margin-bottom:12px;position:relative}
.tl .it:before{content:'';position:absolute;left:-18px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--c,var(--lima))}
.tl .h{font-size:11px;color:var(--cinza)}
.tl .t{font-size:13px;white-space:pre-wrap}
.box{background:#FBF7EE;border-radius:10px;padding:10px;margin:10px 0}
.muted{color:var(--cinza);font-size:12px}
.bar{height:26px;border-radius:6px;background:var(--verde);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;padding:0 8px;white-space:nowrap;min-width:28px}
.brow{display:flex;align-items:center;gap:10px;margin:6px 0}
.brow .lb{width:170px;font-size:12px;font-weight:600;flex-shrink:0}
.brow .rt{font-size:12px;color:var(--cinza);white-space:nowrap}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--verde);color:#fff;padding:10px 16px;border-radius:10px;font-weight:600;z-index:90;display:none}
.loading{position:fixed;inset:0;background:rgba(255,246,233,.7);display:flex;align-items:center;justify-content:center;z-index:80;font-weight:700;color:var(--verde)}
.feed .it{background:#fff;border:1px solid var(--linha);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.mention{background:#FFE7DD;color:#b3360f;border-radius:4px;padding:0 3px;font-weight:700}
.sug{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.hint{background:#EEF5DC;border-radius:10px;padding:10px 12px;font-size:12px;margin-bottom:12px}
@media(max-width:700px){main{padding:12px}.col{min-width:220px;width:220px}.grid2{grid-template-columns:1fr}.grid2 .full{grid-column:1}.brow .lb{width:110px}}
/* ================= Design system Morphê (desktop) ================= */
body{background:#F1F5F0;color:#1d2b25}
header{background:linear-gradient(100deg,#123F33 0%,#1E5E4A 55%,#2A7A5E 100%);box-shadow:0 2px 14px rgba(10,40,30,.25);padding:10px 26px;gap:18px;flex-wrap:nowrap}
header .logo{font-size:20px;font-weight:700;white-space:nowrap}
nav{display:flex;gap:2px;background:rgba(255,255,255,.10);padding:4px;border-radius:14px;flex-wrap:nowrap}
nav button{background:transparent;border:0;color:#DCEBE3;font:600 13px Montserrat;padding:8px 16px;border-radius:11px;cursor:pointer;position:relative;display:flex;align-items:center;gap:7px;white-space:nowrap}
nav button .ic{font-size:15px}
nav button:hover{background:rgba(255,255,255,.12)}
nav button.on{background:#fff;color:#1E5E4A;box-shadow:0 2px 8px rgba(0,0,0,.18)}
nav .badge{background:#F2572B;color:#fff;border-radius:10px;padding:1px 6px;font-size:10px}
.meta-chip{display:none;align-items:center;gap:10px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);border-radius:14px;padding:7px 13px;cursor:pointer;color:#fff;font-size:12px;white-space:nowrap}
.meta-chip:hover{background:rgba(255,255,255,.2)}
.mc-t{font-weight:700}
.mc-b{width:96px;height:8px;background:rgba(255,255,255,.25);border-radius:6px;overflow:hidden;display:inline-block}
.mc-b i{display:block;height:100%;background:#A5C93A;border-radius:6px}
.mc-n{font-weight:700}
header .me{margin-left:auto}
.novo-menu{display:none;position:absolute;right:0;top:40px;background:#fff;border:0;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.22);z-index:60;min-width:220px;padding:6px}
.novo-menu button{display:block;width:100%;text-align:left;background:transparent;border:0;padding:10px 12px;font:600 13px Montserrat;color:#1d2b25;cursor:pointer;border-radius:9px}
.novo-menu button:hover{background:#F1F5F0}
/* lateral */
.sidebar{position:fixed;top:var(--hh,60px);left:0;bottom:0;width:244px;background:#fff;box-shadow:2px 0 14px rgba(20,60,45,.06);padding:18px 12px;overflow-y:auto;z-index:15}
.sidebar .sg{font:700 11px Montserrat;text-transform:uppercase;letter-spacing:.8px;color:var(--ac);padding:2px 10px 14px;display:flex;flex-direction:column;gap:3px}
.sidebar .sg .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ac);margin-right:6px}
.sidebar .sg small{font:500 11px Montserrat;color:#6B7872;text-transform:none;letter-spacing:0}
.sidebar button{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:transparent;border:0;padding:8px 10px;font:600 13.5px Montserrat;color:#1d2b25;cursor:pointer;border-radius:12px;margin-bottom:3px}
.sidebar button .ic{width:32px;height:32px;border-radius:10px;background:color-mix(in srgb,var(--ac) 13%,white);display:flex;align-items:center;justify-content:center;font-size:16px;flex:none}
.sidebar button .lb2{flex:1}
.sidebar button:hover{background:#F1F5F0}
.sidebar button.on{background:var(--ac);color:#fff;box-shadow:0 5px 14px color-mix(in srgb,var(--ac) 38%,transparent)}
.sidebar button.on .ic{background:rgba(255,255,255,.22)}
.sidebar .badge{background:#F2572B;color:#fff;border-radius:10px;padding:1px 7px;font-size:10px}
.sidebar button.on .badge{background:#fff;color:var(--ac)}
.sidebar .colapsa{margin-top:14px;color:#6B7872;font-weight:600;font-size:12px;border-top:1px solid #E3EAE4;border-radius:0;padding-top:12px}
body.sem-lateral .sidebar{display:none}
body:not(.sem-lateral) main{margin-left:244px;max-width:none}
body.side-min .sidebar{width:68px;padding:18px 8px}
body.side-min .sidebar .lb2,body.side-min .sidebar .sg small,body.side-min .sidebar .badge{display:none}
body.side-min .sidebar .sg{font-size:0;padding:0 0 14px 22px}
body.side-min .sidebar button{justify-content:center;padding:8px 0}
body.side-min .sidebar .colapsa .ic{transform:rotate(180deg);background:transparent}
body.side-min:not(.sem-lateral) main{margin-left:68px}
main{padding:22px 28px}
/* tipografia e cartões */
h2{font-size:22px;color:#1E5E4A;margin:0 0 4px}
h3{font-size:12px;color:#52605a;text-transform:uppercase;letter-spacing:.7px;margin:0 0 10px}
.card{background:#fff;border:0;border-radius:16px;box-shadow:0 2px 14px rgba(20,60,45,.07);padding:16px 18px}
.muted{color:#6B7872}
.ph{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;gap:16px}
.sech{font:700 12px Montserrat;color:#52605a;text-transform:uppercase;letter-spacing:.9px;margin:24px 0 10px}
.ch{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;gap:10px}
.ch h3{margin:0;color:#1d2b25;text-transform:none;font-size:15px;letter-spacing:0}
.ch .sub{font-size:12px;color:#6B7872;margin-top:2px}
/* tabelas */
table{width:100%;border-collapse:separate;border-spacing:0;background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 2px 14px rgba(20,60,45,.07)}
th{background:#EAF2EC;color:#1E5E4A;text-align:left;font-size:12px;font-weight:700;padding:10px 12px;position:sticky;top:0;text-transform:none}
td{border-bottom:1px solid #EEF2EE;padding:10px 12px;font-size:13px;vertical-align:top}
tr:last-child td{border-bottom:0}
tr.click:hover td{background:#F6FAF6;cursor:pointer}
table.mini{box-shadow:none;border-radius:0}
table.mini th{position:static;background:transparent;color:#6B7872;font-size:11px;text-transform:uppercase;letter-spacing:.5px;padding:6px 8px;border-bottom:1px solid #E3EAE4}
table.mini td{padding:8px}
table.mini tr.tot td{font-weight:700;border-top:2px solid #E3EAE4}
/* botões */
.btn{background:linear-gradient(135deg,#1E5E4A,#2E8B6A);color:#fff;border:0;border-radius:10px;padding:9px 16px;font:600 13px Montserrat;cursor:pointer;box-shadow:0 2px 6px rgba(30,94,74,.25)}
.btn:hover{filter:brightness(1.06)}
.btn.sec{background:#fff;color:#1E5E4A;border:1px solid #C9D8CE;box-shadow:none}
.btn.sm{padding:6px 11px;font-size:12px;border-radius:9px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.tag{border-radius:8px}
/* tiles de KPI */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px;margin-bottom:6px}
.tile{border-radius:18px;padding:16px 18px 15px;color:#fff;position:relative;overflow:hidden;box-shadow:0 8px 20px rgba(20,60,45,.16);min-height:104px}
.tile .l{font:600 12px Montserrat;opacity:.92;max-width:78%}
.tile .v{font:700 31px/1.1 Montserrat;margin-top:8px}
.tile .s{font-size:11.5px;opacity:.92;margin-top:6px}
.tile .ti{position:absolute;right:14px;top:13px;width:36px;height:36px;border-radius:11px;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:18px}
.t-verde{background:linear-gradient(135deg,#1E5E4A,#2E9470)}
.t-lima{background:linear-gradient(135deg,#5F8A18,#88B02A)}
.t-laranja{background:linear-gradient(135deg,#DE4A1E,#F2793F)}
.t-azul{background:linear-gradient(135deg,#17718F,#33A3C4)}
.t-roxo{background:linear-gradient(135deg,#5846AE,#8470CF)}
.t-ambar{background:linear-gradient(135deg,#A56E00,#D69A12)}
.t-branco{background:#fff;color:#1d2b25;box-shadow:0 2px 14px rgba(20,60,45,.07)}
.t-branco .v{color:#1E5E4A}
/* meta (hero) */
.hero{display:grid;grid-template-columns:1.05fr 1.5fr;gap:30px;padding:22px 28px;margin-bottom:6px;background:linear-gradient(135deg,#fff 0%,#F3F9F1 100%);border-left:6px solid #A5C93A}
.hero-l{display:flex;gap:22px;align-items:center}
.ring{width:136px;height:136px;flex:none}
.rc{font:700 24px Montserrat;fill:#1E5E4A}
.hn{font:700 52px/1 Montserrat;color:#1E5E4A;margin:2px 0 4px}
.hn small{font-size:20px;color:#52605a}
.eyebrow{font:700 11px Montserrat;letter-spacing:.8px;text-transform:uppercase;color:#52605a;margin-bottom:6px}
.hstats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.hstats>div{background:#F1F6F1;border-radius:13px;padding:12px}
.hstats b{display:block;font-size:25px;color:#1E5E4A}
.hstats span{font-size:11px;color:#52605a;line-height:1.3;display:block;margin-top:2px}
.hstats .falta b{color:#D6403A}
.ok{color:#188A62;font-weight:700}.warn{color:#C98F00;font-weight:700}
.meter{background:#E3EEE6;border-radius:8px;height:10px;margin:10px 0;overflow:hidden}
.meter i{display:block;height:100%;background:#188A62;border-radius:8px}
/* grades */
.g{display:grid;gap:16px;margin-top:16px}
.g21{grid-template-columns:2fr 1fr}.g12{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}
@media(max-width:1180px){.g21,.g12,.g3,.hero{grid-template-columns:1fr}}
/* gráficos */
.chart{width:100%;height:auto;display:block}
.gl{stroke:#E4EBE5;stroke-width:1}
.gt{font:500 11px Montserrat,sans-serif;fill:#6B7872}
.gv{font:700 12px Montserrat,sans-serif;fill:#1d2b25}
.donut{display:flex;gap:18px;align-items:center}
.dsvg{width:150px;flex:none}
.dc1{font:700 18px Montserrat,sans-serif;fill:#1d2b25}
.dc2{font:500 10px Montserrat,sans-serif;fill:#6B7872}
.dleg{flex:1;min-width:0}
.lg{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:3px 0}
.lg i{width:10px;height:10px;border-radius:3px;flex:none}
.ln{flex:1;color:#1d2b25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lv{font-weight:700}.lp{color:#6B7872;width:38px;text-align:right}
.seg{transition:opacity .15s}.seg:hover{opacity:.78}
.tip{display:none;position:fixed;z-index:300;background:#1d2b25;color:#fff;padding:8px 11px;border-radius:10px;font-size:12px;pointer-events:none;box-shadow:0 6px 18px rgba(0,0,0,.25);line-height:1.4}
.brow{display:flex;align-items:center;gap:10px;margin:9px 0}
.brow2 .lb{width:124px;flex:none;font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.track{flex:1;height:14px;background:#EEF3EE;border-radius:7px;overflow:hidden}
.fill{height:100%;border-radius:7px}
.brow .rt{min-width:70px;text-align:right;font-weight:700;font-size:12.5px;color:#1d2b25}
.seg2{display:flex;background:#EEF3EE;border-radius:10px;padding:3px}
.seg2 button{border:0;background:transparent;border-radius:8px;padding:5px 10px;font:600 12px Montserrat;cursor:pointer;color:#52605a}
.seg2 button.on{background:#fff;color:#1E5E4A;box-shadow:0 1px 4px rgba(0,0,0,.14)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.stat{background:#fff;border-radius:14px;padding:13px 15px;box-shadow:0 2px 14px rgba(20,60,45,.06)}
.stat span{display:block;font-size:11.5px;color:#52605a}
.stat b{display:block;font-size:19px;color:#1E5E4A;margin-top:3px}
.stat small{display:block;font-weight:500;font-size:11px;color:#6B7872}
.cmp{display:grid;grid-template-columns:96px 1fr 62px;gap:10px;align-items:center;margin:14px 0}
.cn{font-weight:600;font-size:13px}
.cbar{position:relative;height:15px;background:#F0F4F0;border-radius:8px;margin:3px 0}
.cbar i{display:block;height:100%;border-radius:8px}
.cbar span{position:absolute;right:8px;top:0;font-size:11px;font-weight:700;color:#1d2b25;line-height:15px}
.cd{font-weight:700;font-size:13px;text-align:right}
.pbar{position:relative;background:#EEF3EE;border-radius:7px;height:18px;min-width:100px}
.pbar i{display:block;height:100%;background:#9FD3BC;border-radius:7px}
.pbar span{position:absolute;left:8px;top:0;font-size:11px;font-weight:700;line-height:18px;color:#1d2b25}
.brow2 .lb{width:124px}
/* nota literal da equipe */
.nota{background:#FFF8E1;border-left:3px solid #E0A800;border-radius:6px;padding:4px 8px;font-size:12px;margin:3px 0;color:#1d2b25}
.nota b{color:#8a6500}
.lock{margin-left:4px;font-size:12px}
.lockbar{background:#FFF3CD;border-radius:10px;padding:10px 12px;margin-bottom:10px;font-size:12.5px;color:#7a5b00;font-weight:600}
/* meu painel */
.me-h{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.me-av{width:52px;height:52px;border-radius:16px;background:linear-gradient(135deg,#1E5E4A,#88B02A);color:#fff;font:700 20px Montserrat;display:flex;align-items:center;justify-content:center}
.goal{margin:8px 0}
.goal .gt2{display:flex;justify-content:space-between;font-size:12.5px;font-weight:600;margin-bottom:4px}
/* modais */
.modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:80;display:flex;align-items:center;justify-content:center;padding:12px}
.modal{background:#fff;border-radius:16px;width:min(660px,100%);max-height:92vh;display:flex;flex-direction:column;box-shadow:0 12px 40px rgba(0,0,0,.3)}
.modal .mh{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid #E3EAE4;font-size:16px;color:#1E5E4A}
.modal .x{background:none;border:0;font-size:18px;cursor:pointer;color:#6B7872}
.modal .mi{padding:10px 20px;background:#F3F8F2;font-size:12px;color:#52605a}
.modal .mb{padding:16px 20px;overflow:auto}
.modal .mf{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px;border-top:1px solid #E3EAE4}
.modal input,.modal select,.modal textarea{width:100%;font:500 13px Montserrat;padding:9px;border:1px solid #D3DED6;border-radius:9px;background:#fff}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px;padding:6px 4px}
.fgrid>div{min-width:0}
.btn,.btn.lar{white-space:nowrap}
header .me{white-space:nowrap;display:flex;align-items:center;gap:10px}
header select{min-width:128px;font-size:14px}
nav button{padding:8px 13px}
table.mini td{white-space:nowrap}table.mini td:first-child{white-space:normal}
.sidebar button.on .badge{background:#fff!important;color:var(--ac)}

<body>
<header>
  <div class="logo">Morphê <span>Comercial</span></div>
  <nav id="nav"></nav><div id="metaChip" class="meta-chip" onclick="go('painel')"></div>
  <div class="me"><span style="position:relative"><button class="btn lar sm" onclick="novoMenu(event)">+ Novo ▾</button><div class="novo-menu" id="novoMenu"></div></span> 👤 Você: <select id="meSel"></select></div>
</header>
<aside class="sidebar" id="sidebar"></aside>
<main id="main"></main>
<div class="ov" id="ov" onclick="closeDrawer()"></div>
<div class="drawer" id="drawer"></div>
<div class="toast" id="toast"></div>
<div class="loading" id="loading">Carregando…</div>

<script>
var D = null, VIEW = 'hoje', ME = '', F = {q:'', resp:'', seg:'', orig:'', pvTodos:false}, OPEN = null, DRAG = null, PERIOD = 90;
var TABS = [['hoje','Hoje'],['funil','Funil'],['leads','Leads'],['sug','Sugeridos'],['buscar','Buscar no Maps'],['mural','Mural'],['dash','Dashboard'],['posVenda','Pós-venda 🔄']];
/* ===================== Navegação: 4 áreas no topo + itens da área na lateral ===================== */
var NOME = {hoje:'Meu painel',funil:'Pipeline',leads:'Base de leads',sug:'Lead gen',buscar:'Prospecção ativa',amostras:'Sampling (amostras)',icp:'ICP e lead scoring',dash:'Dashboard de pipeline',
  carteira:'Saúde da carteira',pedidos:'Pedidos (sell-in)',followups:'Cadência de follow-up',sellin:'Giro: sell-in e sell-out',posVenda:'Contato de pós-venda',painel:'Dashboard do time',previsao:'Forecast e risco',mural:'Mural da equipe'};
var AREAS = [
  {k:'hoje', n:'Meu painel', ic:'🏠', cor:'#1E5E4A', dflt:'hoje', it:[['hoje',NOME.hoje,'🏠']]},
  {k:'pros', n:'Aquisição', ic:'🎯', cor:'#188A62', dflt:'funil', sub:'Hunting · pré-venda e pipeline', it:[['funil',NOME.funil,'🧭'],['leads',NOME.leads,'👥'],['sug',NOME.sug,'💡'],['buscar',NOME.buscar,'🔎'],['amostras',NOME.amostras,'🧪'],['icp',NOME.icp,'🎯'],['dash',NOME.dash,'📈']]},
  {k:'pos', n:'Carteira', ic:'🤝', cor:'#E8552B', dflt:'carteira', sub:'Farming · pós-venda e retenção', it:[['carteira',NOME.carteira,'🤝'],['pedidos',NOME.pedidos,'🛒'],['followups',NOME.followups,'📞'],['sellin',NOME.sellin,'📦'],['posVenda',NOME.posVenda,'🔄']]},
  {k:'gest', n:'Inteligência', ic:'📊', cor:'#2088B5', dflt:'painel', sub:'RevOps · dashboard, forecast e metas', it:[['painel',NOME.painel,'📊'],['previsao',NOME.previsao,'🔮'],['mural',NOME.mural,'📌']]}
];
function areaDe(v){for(var i=0;i<AREAS.length;i++)for(var j=0;j<AREAS[i].it.length;j++)if(AREAS[i].it[j][0]===v)return AREAS[i];return AREAS[0]}
function navBadges(){
  var b={},nSug=D.leads.filter(function(l){return l.Etapa==='Sugerido'}).length;
  var nVenc=D.leads.filter(function(l){var x=days(l['Data próximo passo']);return ativo(l)&&x!==null&&x>0&&(!ME||l['Responsável']===ME)}).length;
  var nMe=pendentes(ME).length;
  var nPV=D.leads.filter(function(l){if(l.Etapa!=='Ganho')return false;var ds=diasSemContato(l);var vp=days(l['Data próximo passo']);return (vp!==null&&vp>0)||(ds===null||ds>=30)}).length;
  if(nSug)b.sug=['',nSug];
  if(nVenc)b.hoje=['var(--verm)',nVenc+' venc.'];else if(nMe)b.hoje=['',nMe];
  if(nPV)b.posVenda=['var(--laranja)',nPV];
  if(INT){var k=INT.painel.kpis;if(k.atrasados)b.carteira=['var(--verm)',k.atrasados];if(k.fupAgora)b.followups=['var(--laranja)',k.fupAgora];
    var am=INT.carteira.prospects.filter(function(p){return p.status==='sem resposta 7d+'}).length;if(am)b.amostras=['var(--laranja)',am]}
  return b}
function somaBadge(area,b){var n=0;area.it.forEach(function(t){var x=b[t[0]];if(x&&!isNaN(parseInt(x[1])))n+=parseInt(x[1])});return n}
function renderNav0(){var b=navBadges(),cur=areaDe(VIEW);
  $('nav').innerHTML=AREAS.map(function(a){var n=a.k!=='hoje'?somaBadge(a,b):0;
    return '<button class="'+(cur.k===a.k?'on':'')+'" style="--ac:'+a.cor+'" onclick="go(\''+a.dflt+'\')"><span class="ic">'+a.ic+'</span>'+a.n+(n?'<span class="badge" style="background:var(--verm)">'+n+'</span>':'')+'</button>'}).join('')}
function renderSidebar(){var b=navBadges(),a=areaDe(VIEW);
  $('sidebar').style.setProperty('--ac',a.cor);
  $('sidebar').innerHTML=(a.k==='hoje'?'':'<div class="sg"><span class="dot"></span>'+a.n+(a.sub?'<small>'+a.sub+'</small>':'')+'</div>')
    +a.it.map(function(t){var x=b[t[0]];return '<button title="'+t[1]+'" class="'+(VIEW===t[0]?'on':'')+'" onclick="go(\''+t[0]+'\')"><span class="ic">'+t[2]+'</span><span class="lb2">'+t[1]+'</span>'+(x?'<span class="badge"'+(x[0]?' style="background:'+x[0]+'"':'')+'>'+x[1]+'</span>':'')+'</button>'}).join('');
  if(a.k!=='hoje')$('sidebar').insertAdjacentHTML('beforeend','<button class="colapsa" onclick="toggleMin()" title="Recolher/expandir menu"><span class="ic">◀</span><span class="lb2">Recolher menu</span></button>');
  try{document.body.classList.toggle('side-min',localStorage.getItem('morphe_side_min')==='1')}catch(e){}
  document.body.classList.toggle('sem-lateral',a.k==='hoje');
  var hd=document.querySelector('header');if(hd)document.documentElement.style.setProperty('--hh',hd.offsetHeight+'px')}
function toggleMin(){try{localStorage.setItem('morphe_side_min',localStorage.getItem('morphe_side_min')==='1'?'0':'1')}catch(e){}renderSidebar()}
function novoMenu(e){e.stopPropagation();var m=$('novoMenu');if(m.style.display==='block'){m.style.display='none';return}
  m.innerHTML=[['👥','Novo lead','quickAdd()'],['🛒','Novo pedido','formPedido()'],['📞','Registrar follow-up','formFollowup()'],['🤝','Novo cliente','formCliente()'],['📦','Registrar sell-out','formSellout()']].map(function(x){return '<button onclick="document.getElementById(\'novoMenu\').style.display=\'none\';'+x[2]+'">'+x[0]+' '+x[1]+'</button>'}).join('');m.style.display='block'}
document.addEventListener('click',function(){var m=$('novoMenu');if(m)m.style.display='none'});

/* ===================== Dados do Monitoramento (carregados 1x, atualizados em segundo plano) ===================== */
var INT=null,INT_AT=0,INT_BUSY=false,INT_ERR=null;
function intLoad(){if(INT_BUSY)return;INT_BUSY=true;
  callSilent('getInteligencia').then(function(r){INT=r;INT_AT=Date.now();INT_BUSY=false;INT_ERR=null;render()}).catch(function(e){INT_BUSY=false;INT_ERR=(e&&e.message)||String(e);render()})}
function intApply(r){INT=r;INT_AT=Date.now();render()}
function needInt(titulo){
  if(INT){if(Date.now()-INT_AT>180000&&!INT_BUSY)intLoad();return true}
  if(INT_ERR){$('main').innerHTML='<h2>'+titulo+'</h2><div class="card">Não foi possível ler o Monitoramento: '+esc(INT_ERR)+' <button class="btn sm" onclick="INT_ERR=null;render()">Tentar de novo</button></div>';return false}
  $('main').innerHTML='<h2>'+titulo+'</h2><div class="card">Carregando dados do Monitoramento…</div>';intLoad();return false}
function gravar(fn,arg,msg,done,fail){callSilent(fn,arg).then(function(r){intApply(r);toast(msg);if(done)done(r)}).catch(function(){if(fail)fail()})}

/* ===================== Formatação ===================== */
function brl(n){return n==null||isNaN(n)?'—':'R$ '+Math.round(n).toLocaleString('pt-BR')}
function pcX(x,dec){return x==null||isNaN(x)?'—':(x*100).toFixed(dec==null?0:dec)+'%'}
function dBR(s){if(!s)return '';var p=String(s).slice(0,10).split('-');return p.length<3?s:p[2]+'/'+p[1]+'/'+p[0]}
function hojeIso(){return isoDay(new Date())}
function recarregar(){return '<button class="btn sec sm" onclick="intLoad();toast(\'Atualizando…\')">↻ Atualizar dados</button>'}
var SIT_COR={'🔴 Atrasado':'red','🟠 Sem resposta':'yel','🟡 Fazer FUP':'yel','🔵 FUP da amostra':'blue','🟢 Em dia':'','✅ FUP feito':'','⚪ Sem pedidos':'gray'};
function tagSit(s){return '<span class="tag '+(SIT_COR[s]||'')+'">'+esc(s)+'</span>'}
var NIVEL={critico:['Crítico','red'],alto:['Alto','red'],medio:['Médio','yel'],baixo:['Baixo',''],'sem-pedidos':['—','gray']};
function tagRisco(a){var n=NIVEL[a.nivel]||['—','gray'];return '<span class="tag '+n[1]+'">'+n[0]+(a.score!=null?' · '+a.score:'')+'</span>'}

/* ===================== Formulários (gravam na planilha de Monitoramento) ===================== */
function closeModal(){var m=$('mdl');if(m)m.remove()}
function campoHTML(c){var id='mf_'+c.k,v=c.v==null?'':c.v,cls=c.full?' class="full"':'',inp;
  if(c.t==='select')inp='<select id="'+id+'">'+opts(c.opts||[],v,c.blank===undefined?'—':c.blank)+'</select>';
  else if(c.t==='area')inp='<textarea id="'+id+'" rows="3" placeholder="'+esc(c.ph||'')+'">'+esc(v)+'</textarea>';
  else inp='<input id="'+id+'" type="'+(c.t||'text')+'" value="'+esc(v)+'" placeholder="'+esc(c.ph||'')+'"'+(c.t==='number'?' step="any" min="0"':'')+'>';
  return '<label'+cls+'>'+esc(c.l)+inp+(c.dica?'<small class="muted" style="font-weight:400">'+esc(c.dica)+'</small>':'')+'</label>'}
function formModal(o){closeModal();
  document.body.insertAdjacentHTML('beforeend','<div class="modal-ov" id="mdl" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="mh"><b>'+esc(o.titulo)+'</b><button class="x" onclick="closeModal()">✕</button></div>'+(o.intro?'<div class="mi">'+o.intro+'</div>':'')+'<div class="mb grid2">'+o.campos.map(campoHTML).join('')+'</div><div class="mf"><button class="btn sec" onclick="closeModal()">Cancelar</button><button class="btn" id="mdlOk">'+(o.ok||'Salvar')+'</button></div></div></div>');
  $('mdlOk').onclick=function(){var v={};o.campos.forEach(function(c){var el=$('mf_'+c.k);v[c.k]=el?el.value:''});var b=$('mdlOk');b.disabled=true;b.textContent='Salvando…';
    o.salvar(v,closeModal,function(){b.disabled=false;b.textContent=o.ok||'Salvar'})}}
function nomesClientes(tipo){return (INT?INT.clientes:[]).filter(function(c){return !tipo||(tipo==='ativo'?c.tipo==='Ativo':c.tipo!=='Ativo')}).map(function(c){return c.nome})}
function todosClientes(){return nomesClientes().sort(function(a,b){return a.localeCompare(b)})}

function formPedido(cliente){if(!INT)return;var L=INT.listas;
  formModal({titulo:'Novo pedido',ok:'Registrar pedido',intro:'Os valores (faixa de preço, custo e margem) são calculados pela própria planilha com a tabela de preços.',campos:[
    {k:'cliente',l:'Cliente',t:'select',opts:todosClientes(),v:cliente||'',full:true,blank:'Escolha…'},
    {k:'data',l:'Data do pedido',t:'date',v:hojeIso()},{k:'entrega',l:'Data de entrega',t:'date',v:hojeIso()},
    {k:'postas',l:'Postas (emb. 2 un)',t:'number'},{k:'c200',l:'Cubos 200g',t:'number'},{k:'c300',l:'Cubos 300g',t:'number'},{k:'d200',l:'Desfiado 200g',t:'number'},{k:'d300',l:'Desfiado 300g',t:'number'},
    {k:'transporte',l:'Transporte',t:'select',opts:L.transportes,blank:'—'},{k:'origem',l:'Origem do pedido',t:'select',opts:L.origens,v:'WhatsApp',blank:'—'},
    {k:'tabela',l:'Tabela de preço',t:'select',opts:L.tabelas,v:L.ultimaTabela||L.tabelas[0],blank:'—'},{k:'faixa',l:'Faixa',t:'select',opts:L.faixas,v:'Auto',blank:'',dica:'Auto escolhe pela quantidade'},{k:'valorAjustado',l:'Valor ajustado (R$) — opcional',t:'number',full:true,dica:'Só se o valor fechado for diferente do calculado'},
    {k:'obs',l:'Observações',t:'area',full:true}],
    salvar:function(v,ok,fail){if(!v.cliente){toast('Escolha o cliente');return fail()}
      gravar('registrarPedido',v,'Pedido registrado',function(r){ok();var s=r.salvo;if(s)toast('Pedido registrado · '+brl(s.valorFinal)+' · margem '+(typeof s.margemPct==='number'?pcX(s.margemPct,0):s.margemPct||'—'))},fail)}})}

function formFollowup(cliente,tipo){if(!INT)return;var L=INT.listas;
  formModal({titulo:'Registrar follow-up',ok:'Registrar',campos:[
    {k:'cliente',l:'Cliente',t:'select',opts:todosClientes(),v:cliente||'',full:true,blank:'Escolha…'},
    {k:'data',l:'Data do contato',t:'date',v:hojeIso()},{k:'canal',l:'Canal',t:'select',opts:L.canais,v:'WhatsApp',blank:'—'},
    {k:'resultado',l:'Resultado',t:'select',opts:L.resultadosFup,full:true,blank:'Escolha…'},
    {k:'tipo',l:'Tipo de contato',t:'select',opts:L.tiposContato,v:tipo||'Recompra',blank:'—'},{k:'prox',l:'Próximo passo',t:'text'},
    {k:'obs',l:'Observações',t:'area',full:true}],
    salvar:function(v,ok,fail){if(!v.cliente||!v.resultado){toast('Escolha cliente e resultado');return fail()}gravar('registrarFollowup',v,'Follow-up registrado',ok,fail)}})}

function formSellout(cliente){if(!INT)return;
  formModal({titulo:'Registrar sell-out',ok:'Registrar',intro:'Sell-out = o que o ponto de venda vendeu ao consumidor final (informado por você ou pelo cliente).',campos:[
    {k:'cliente',l:'Cliente',t:'select',opts:nomesClientes('ativo'),v:cliente||'',full:true,blank:'Escolha…'},
    {k:'un',l:'Unidades vendidas',t:'number'},{k:'data',l:'Data',t:'date',v:hojeIso()},{k:'obs',l:'Observação',t:'area',full:true}],
    salvar:function(v,ok,fail){gravar('registrarSellout',v,'Sell-out registrado',ok,fail)}})}

var PUBLICOS_POSICAO=['Destaque / sugestão do chef','Meio do cardápio','Final do cardápio','Só sob consulta','Não está no cardápio'];
function formCliente(nome){if(!INT)return;var c=INT.clientes.filter(function(x){return x.nome===nome})[0]||{nome:'',tipo:'Ativo',ciclo:'',antec:3};var L=INT.listas;
  formModal({titulo:nome?'Cadastro do cliente':'Novo cliente',campos:[
    {k:'nome',l:'Nome do cliente',t:'text',v:c.nome,full:true},{k:'tipo',l:'Tipo',t:'select',opts:L.tiposCliente,v:/prospe/i.test(c.tipo)?'Prospecção':c.tipo,blank:''},{k:'cidade',l:'Cidade (ex.: São Paulo/SP)',t:'text',v:c.cidade},
    {k:'ciclo',l:'Ciclo padrão (dias)',t:'number',v:c.ciclo||'',dica:'Usado até haver pedidos suficientes para calcular o ciclo real'},{k:'antec',l:'Antecedência do FUP (dias)',t:'number',v:c.antec===0?'':c.antec},
    {k:'obs',l:'Contato / observações',t:'area',v:c.obs,full:true},{k:'motivo',l:'Motivo da queda (se diminuiu ou parou)',t:'select',opts:L.motivosQueda,v:c.motivo,full:true,blank:'— sem queda —'}],
    salvar:function(v,ok,fail){if(!v.nome){toast('Informe o nome');return fail()}gravar('salvarCliente',v,'Cliente salvo',ok,fail)}})}

var MOTIVOS_ADESAO=['Sem destaque no cardápio','Equipe não indica','Público do local não é flexitariano/vegano','Descrição fraca / sem foto','Preço do prato alto para o público','Falta de divulgação','Item novo (ainda em teste)','Outro'];
var ACOES_ADESAO={
  'Sem destaque no cardápio':['Pedir posição de destaque ou "sugestão do chef"','Incluir foto do prato no cardápio ou QR code'],
  'Equipe não indica':['Degustação para a equipe de salão','Combinar com o gerente uma frase de indicação do prato'],
  'Público do local não é flexitariano/vegano':['Analisar o público e o cardápio do local antes de insistir','Ver se há evento ou dia temático em que o item se encaixe'],
  'Descrição fraca / sem foto':['Reescrever a descrição com linguagem de desejo (sabor, textura, ocasião)','Enviar foto e vídeo do prato montado (o vídeo do Fábio Chaves já converte)'],
  'Preço do prato alto para o público':['Revisar com o chef o preço e a margem do prato','Conferir se o ticket do cardápio sustenta o valor do prato'],
  'Falta de divulgação':['Pedir post ou stories do local mostrando o prato','Material de ponto de venda'],
  'Item novo (ainda em teste)':['Marcar revisão em 15 dias','Combinar meta de pedidos por semana e acompanhar'],
  'Outro':['Registrar o motivo nas notas e discutir com o time']};
function formFicha(nome){if(!INT)return;var f=null;INT.carteira.ativos.concat(INT.sell.linhas).forEach(function(x){if(x.nome===nome&&x.ficha)f=x.ficha});f=f||{};
  formModal({titulo:'Ficha de adesão · '+nome,intro:'Olhe o cardápio, o público e o ticket do local. Isso orienta a conversa, sem sugerir produto automaticamente.',campos:[
    {k:'cliente',l:'Cliente',t:'text',v:nome,full:true},
    {k:'ticketCardapio',l:'Ticket médio do prato/cardápio (R$)',t:'number',v:f.ticketCardapio||''},{k:'publico',l:'Público do local',t:'text',v:f.publico||'',ph:'ex.: famílias, vegetarianos, executivos'},
    {k:'noCardapio',l:'Item no cardápio?',t:'select',opts:['Sim','Não','Em teste'],v:f.noCardapio||'',blank:'—'},{k:'desde',l:'No cardápio desde',t:'date',v:f.desde||''},
    {k:'posicao',l:'Posição no cardápio',t:'select',opts:PUBLICOS_POSICAO,v:f.posicao||'',blank:'—'},{k:'pedidosSemana',l:'Pedidos do item por semana',t:'number',v:f.pedidosSemana||''},
    {k:'motivo',l:'Motivo da baixa adesão',t:'select',opts:MOTIVOS_ADESAO,v:f.motivo||'',full:true,blank:'— sem problema —'},
    {k:'acoes',l:'Ações em andamento',t:'area',v:f.acoes||'',full:true},{k:'notas',l:'Notas',t:'area',v:f.notas||'',full:true}],
    salvar:function(v,ok,fail){gravar('salvarFicha',v,'Ficha salva',ok,fail)}})}

/* ===================== Clientes e Churn ===================== */
var OPENC='';
function abrirC(n){OPENC=OPENC===n?'':n;vCarteira()}
function vCarteira(){if(!needInt(NOME.carteira))return;var C=INT.carteira,R=C.resumo;
  var fs=F.cSit||'',lista=C.ativos.filter(function(a){return !fs||a.situacao===fs});
  var sits=['🔴 Atrasado','🟠 Sem resposta','🟡 Fazer FUP','✅ FUP feito','🟢 Em dia'];
  var h='<div class="row" style="align-items:center;margin-bottom:6px"><h2 style="margin:0">'+NOME.carteira+'</h2><span style="margin-left:auto;display:flex;gap:8px">'+recarregar()+'<button class="btn sec sm" onclick="formCliente()">+ Novo cliente</button><button class="btn sm" onclick="formPedido()">+ Novo pedido</button></span></div>';

var ETAPAS_F=['Mapeado','Contato feito','Respondeu','Amostra enviada','Negociação','Ganho'];

  D.leads.forEach(function(l){if(l.Etapa in idx)for(var i=0;i<=idx[l.Etapa];i++)reached[ETAPAS_F[i]][l.ID]=1});
  var tr=transicoes();tr.forEach(function(t){if(t.para in idx)for(var i=0;i<=idx[t.para];i++)reached[ETAPAS_F[i]][t.lead]=1});
  var porLead={};tr.forEach(function(t){(porLead[t.lead]=porLead[t.lead]||[]).push(t)});var tempo={};
  Object.keys(porLead).forEach(function(k){var a=porLead[k].sort(function(x,y){return x.data<y.data?-1:1});for(var i=0;i<a.length-1;i++){var dd=(d(a[i+1].data)-d(a[i].data))/864e5;if(dd>=0){(tempo[a[i].para]=tempo[a[i].para]||[]).push(dd)}}});

  var ids=leadIdsDe(fn,a);if(!ids.length)return '';if(!ME)return 'Escolha seu nome no canto superior direito antes de agir.';
  for(var i=0;i<ids.length;i++){var l=lead(ids[i]);if(lockedFor(l))return msgDono(l)}return ''}
function withQuem(fn,a){a=a.slice();
  if(fn==='moveLead'){while(a.length<3)a.push('');a[3]=ME}
  else if(fn==='reativarLead'){a[1]=ME}
  else if(fn==='bulkMove'){while(a.length<3)a.push('');a[3]=ME}
  else if((fn==='addActivity'||fn==='saveLead'||fn==='addTask')&&a[0]&&typeof a[0]==='object'){a[0]=Object.assign({},a[0],{quem:ME})}
  return a}

function call(fn){var args=[].slice.call(arguments,1);var gm=guardFront(fn,args);if(gm){toast(gm);return Promise.reject(new Error(gm))}args=withQuem(fn,args);busy(true);return new Promise(function(ok,ko){google.script.run.withSuccessHandler(function(r){busy(false);ok(r)}).withFailureHandler(function(e){busy(false);alertErr(e);ko(e)})[fn].apply(null,args)})}
// Igual ao call(), mas sem bloquear a tela com o "Carregando…" — usado quando a tela já foi
// atualizada de forma otimista e o usuário pode continuar usando o app enquanto salva atrás.
function callSilent(fn){var args=[].slice.call(arguments,1);var gm=guardFront(fn,args);if(gm){toast(gm);return Promise.reject(new Error(gm))}args=withQuem(fn,args);return new Promise(function(ok,ko){google.script.run.withSuccessHandler(ok).withFailureHandler(function(e){alertErr(e);ko(e)})[fn].apply(null,args)})}
function alertErr(e){toast('Erro: '+(e&&e.message||e))}
function d(s){if(!s)return null;var x=new Date(String(s).length<=10?s+'T00:00:00':s);return isNaN(x)?null:x}
function fmt(s){var x=d(s);return x?('0'+x.getDate()).slice(-2)+'/'+('0'+(x.getMonth()+1)).slice(-2):''}
function fmtH(s){var x=d(s);return x?fmt(s)+' '+('0'+x.getHours()).slice(-2)+':'+('0'+x.getMinutes()).slice(-2):''}

var GEN=['restaurante','emporio','emporium','cozinha','vegana','vegano','vegan','veg','vegetariano','vegetariana','vegetal','natural','naturais','produtos','cafe','cafeteria','bistro','bar','loja','mercado','supermercado','supermercados','hortifruti','comida','culinaria','plant','based','delicias','casa','espaco','store','food','foods','market','saudavel','saudaveis','granel','atelie','organicos','organico','sao','paulo','campinas','maria','santa','verde','vida','grao','graos','terra','mundo','sabor','sabores'];
function nrm(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')}
function toks(s){return nrm(s).replace(/[^a-z0-9 ]/g,' ').split(/\s+/).map(function(w){return w.replace(/(.)\1+/g,'$1')}).filter(function(w){return w.length>=4&&GEN.indexOf(w)<0})}
function cmp(s){return nrm(s).replace(/[^a-z0-9]/g,'').replace(/(.)\1+/g,'$1')}
function igH(h){h=nrm(h).trim();var m=h.match(/instagram\.com\/([^/?#\s]+)/);if(m)h=m[1];return h.replace(/^@/,'')}
function telD(t){var x=String(t||'').replace(/\D/g,'');if(x.length>11&&x.indexOf('55')===0)x=x.slice(2);return x.length>=10?x:''}
function parecidos(o,ignId){var n=cmp(o.Estabelecimento),tk=toks(o.Estabelecimento),g=igH(o.Instagram),f=telD(o.WhatsApp||o.Telefone);
  return D.leads.filter(function(l){if(l.ID===(ignId||o.ID)||l.Etapa==='Sugerido'&&o.Etapa==='Sugerido')return false;var m=cmp(l.Estabelecimento);
    if(n&&m&&(n===m||(n.length>=6&&m.indexOf(n)>=0)||(m.length>=6&&n.indexOf(m)>=0)))return true;
    if(g&&igH(l.Instagram)===g)return true;if(f&&(telD(l.WhatsApp)===f||telD(l.Telefone)===f))return true;
    var t2=toks(l.Estabelecimento);return tk.some(function(w){return t2.indexOf(w)>=0})}).slice(0,4)}
function removerSug(id){call('removerSugerido',id).then(function(r){after(r);toast('Sugestão removida')})}

var QA_MODE='um';
/* entende o que foi colado: @insta, link do insta, telefone, e-mail, site */
function parseContato(s){var o={};s=String(s||'');var tm=s.match(/(\+?55\s?)?\(?\d{2}\)?[\s.-]?9?\d{4}[\s.-]?\d{4}/);if(tm&&telD(tm[0])){o.WhatsApp=tm[0].trim();s=s.replace(tm[0],' ')}s.split(/[\s,;|]+/).forEach(function(p){if(!p)return;
  if(/instagram\.com\//i.test(p)||/^@[\w.]+$/.test(p))o.Instagram='@'+igH(p);
  else if(/^[\w.+-]+@[\w-]+\.[\w.]+$/.test(p))o['E-mail']=p;
  else if(/^https?:\/\//i.test(p)||/^www\./i.test(p))o.Site=p;
  else if(telD(p))o.WhatsApp=p});return o}
function parseLinha(line){var parts=line.split(/\t|;|,(?![^(]*\))| - | – /).map(function(x){return x.trim()}).filter(String);if(!parts.length)return null;
  var o={Estabelecimento:''},resto=[];parts.forEach(function(p){var c=parseContato(p);if(Object.keys(c).length&&p.split(/\s+/).length<=3){Object.keys(c).forEach(function(k){o[k]=c[k]})}else resto.push(p)});
  if(!resto.length&&o.Instagram)resto.push(o.Instagram.slice(1));o.Estabelecimento=resto.shift()||'';if(resto.length)o.Cidade=resto.shift();if(resto.length)o['Observações']=resto.join(' · ');return o.Estabelecimento?o:null}

// ---------------- DASHBOARD
function inPeriod(s){if(!PERIOD)return true;var x=days(s);return x!==null&&x<=PERIOD}
function pct(a,b){return b?Math.round(a/b*100)+'%':'—'}
function bars(rows,max,cor){max=max||Math.max.apply(null,rows.map(function(r){return r[1]}).concat([1]));return rows.map(function(r){return '<div class="brow"><div class="lb">'+esc(r[0])+'</div><div style="flex:1"><div class="bar" style="width:'+Math.max(r[1]/max*100,4)+'%;background:'+(r[3]||cor||'var(--verde)')+'">'+r[1]+'</div></div><div class="rt">'+(r[2]||'')+'</div></div>'}).join('')}
function kpi(l,v,s,cor){return '<div class="card kpi"><div class="l">'+l+'</div><div class="v" style="'+(cor?'color:'+cor:'')+'">'+v+'</div><div class="s">'+(s||'')+'</div></div>'}
function vDash(){
  var L=D.leads.filter(function(l){return l.Etapa!=='Sugerido'&&inPeriod(l['Criado em'])});
  var A=D.atividades.filter(function(a){return inPeriod(a.Data)});
  var C=A.filter(function(a){return a.Tipo==='Contato'});
  var ordem=['Mapeado','Contato feito','Respondeu','Amostra enviada','Negociação','Ganho'];
  // alcançou etapa >= X
  var maxIdx={};L.forEach(function(l){maxIdx[l.ID]=ordem.indexOf(l.Etapa)});
  D.atividades.forEach(function(a){if(a.Tipo==='Etapa'&&maxIdx[a['Lead ID']]!==undefined){var dest=String(a.Texto).split('→').pop().trim().replace(/\s*\(.*$/,'');var i=ordem.indexOf(dest);if(i>maxIdx[a['Lead ID']])maxIdx[a['Lead ID']]=i}});
  L.forEach(function(l){if(l.Etapa==='Perdido'&&maxIdx[l.ID]<1)maxIdx[l.ID]=1});
  var fun=ordem.map(function(e,i){var n=L.filter(function(l){return maxIdx[l.ID]>=i}).length;return [e,n]});
  fun=fun.map(function(r,i){return [r[0],r[1],i?pct(r[1],fun[i-1][1])+' da etapa anterior':'',COR[r[0]]]});
  var ganhos=L.filter(function(l){return l.Etapa==='Ganho'}).length,perd=L.filter(function(l){return l.Etapa==='Perdido'}).length;
  // canal
  var porCanal={};C.forEach(function(a){var k=a.Canal||'Outro';porCanal[k]=porCanal[k]||{};var key=a['Lead ID'];porCanal[k][key]=porCanal[k][key]||RESPONDEU.indexOf(a.Resultado)>=0});
  var canalRows=Object.keys(porCanal).map(function(k){var v=porCanal[k],t=Object.keys(v).length,r=Object.keys(v).filter(function(x){return v[x]}).length;return [k,t,r]}).sort(function(a,b){return b[1]-a[1]});
  // migração de canal
  var byLead={};D.atividades.filter(function(a){return a.Tipo==='Contato'&&a['Lead ID']}).sort(function(a,b){return a.Data<b.Data?-1:1}).forEach(function(a){(byLead[a['Lead ID']]=byLead[a['Lead ID']]||[]).push(a)});
  var mig={};Object.keys(byLead).forEach(function(id){var arr=byLead[id];for(var i=1;i<arr.length;i++){if(arr[i].Canal&&arr[i-1].Canal&&arr[i].Canal!==arr[i-1].Canal){if(!inPeriod(arr[i].Data))continue;var k=arr[i-1].Canal+' → '+arr[i].Canal;mig[k]=mig[k]||{t:0,r:0};mig[k].t++;var resp=arr.slice(i).some(function(x){return x.Canal===arr[i].Canal&&RESPONDEU.indexOf(x.Resultado)>=0&&x.Resultado!=='Encaminhou para outro contato/canal'});if(resp)mig[k].r++;break}}});
  var migRows=Object.keys(mig).map(function(k){return [k,mig[k].t,mig[k].r]}).sort(function(a,b){return b[1]-a[1]});
  function grp(key){var g={};L.forEach(function(l){var k=l[key]||'(vazio)';g[k]=g[k]||{t:0,g:0,a:0};g[k].t++;if(l.Etapa==='Ganho')g[k].g++;if(maxIdx[l.ID]>=3)g[k].a++});return Object.keys(g).map(function(k){return [k,g[k].t,g[k].a+' amostras · '+g[k].g+' ganhos ('+pct(g[k].g,g[k].t)+')']}).sort(function(a,b){return b[1]-a[1]})}
  var pessoa=D.users.map(function(u){var c=C.filter(function(a){return a.Autor===u.nome}).length;var g=L.filter(function(l){return l['Responsável']===u.nome&&l.Etapa==='Ganho'}).length;return [u.nome,c,g+' ganhos']}).filter(function(r){return r[1]||r[2]!=='0 ganhos'});
  var mot={};L.filter(function(l){return l.Etapa==='Perdido'}).forEach(function(l){var k=l['Motivo de perda']||'(sem motivo)';mot[k]=(mot[k]||0)+1});
  var motRows=Object.keys(mot).map(function(k){return [k,mot[k],'',' #E5484D']}).sort(function(a,b){return b[1]-a[1]});
  var sem=D.atividades.filter(function(a){return a.Tipo==='Contato'&&days(a.Data)!==null&&days(a.Data)<7}).length;
  var amostras=L.filter(function(l){return maxIdx[l.ID]>=3}).length;
  var tempo=L.filter(function(l){return l.Etapa==='Ganho'}).map(function(l){var a=d(l['Criado em']),b=d(l['Etapa desde']);return a&&b?(b-a)/864e5:null}).filter(function(x){return x!==null});
  var respTot=canalRows.reduce(function(s,r){return s+r[2]},0),contTot=canalRows.reduce(function(s,r){return s+r[1]},0);
  var ativos=D.leads.filter(ativo).length;
  // === NOVAS MÉTRICAS ===
  // #2 Tempo médio por etapa (via histórico de mudanças)
  var etapaHist={};D.atividades.filter(function(a){return a.Tipo==='Etapa'&&a['Lead ID']}).sort(function(a,b){return a.Data<b.Data?-1:1}).forEach(function(a){var id=a['Lead ID'];etapaHist[id]=etapaHist[id]||[];etapaHist[id].push({dt:d(a.Data),etapa:String(a.Texto).split('→')[0].trim()})});
  var etapaDias={};Object.keys(etapaHist).forEach(function(id){var arr=etapaHist[id];for(var i=0;i<arr.length-1;i++){var e=arr[i].etapa,diff=arr[i+1].dt-arr[i].dt;if(diff>0){etapaDias[e]=etapaDias[e]||{s:0,n:0};etapaDias[e].s+=diff/864e5;etapaDias[e].n++}}});
  var tempoRows=ordem.slice(0,-1).map(function(e){var t=etapaDias[e];return t&&t.n>0?[e,Math.round(t.s/t.n),Math.round(t.s/t.n)+'d médio ('+t.n+' obs.)']:null}).filter(Boolean);
  // #4 Dia da semana com mais respostas
  var nDias=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];var porDia=[0,0,0,0,0,0,0];
  D.atividades.filter(function(a){return a.Tipo==='Contato'&&RESPONDEU.indexOf(a.Resultado)>=0&&inPeriod(a.Data)}).forEach(function(a){var dt=d(a.Data);if(dt)porDia[dt.getDay()]++});
  var diaRows=nDias.map(function(n,i){return [n,porDia[i],porDia[i]+' respostas']});
  // #6 Top cidades
  var cidades={};D.leads.filter(function(l){return ativo(l)}).forEach(function(l){var c=(l.Cidade||'(sem cidade)').trim().split(',')[0].trim();cidades[c]=(cidades[c]||0)+1});
  var cidadeRows=Object.keys(cidades).map(function(c){return [c,cidades[c],cidades[c]+' leads ativos']}).sort(function(a,b){return b[1]-a[1]}).slice(0,10);
  // #9 Leads sem contato há X dias
  var xSC=+(window._xSC||30);
  var semCont=D.leads.filter(ativo).map(function(l){var ds=diasSemContato(l);return {l:l,d:ds}}).filter(function(x){return x.d===null||x.d>=xSC}).sort(function(a,b){return (b.d===null?9999:b.d)-(a.d===null?9999:a.d)});
  // #11 Taxa de resposta por semana (últimas 8 semanas)
  var porSem={};D.atividades.filter(function(a){return a.Tipo==='Contato'&&inPeriod(a.Data)}).forEach(function(a){var dt=d(a.Data);if(!dt)return;var dow=dt.getDay();var seg=new Date(dt-dow*864e5+(dow===0?-6:1)*864e5);var sk=isoDay(seg);porSem[sk]=porSem[sk]||{c:0,r:0};porSem[sk].c++;if(RESPONDEU.indexOf(a.Resultado)>=0)porSem[sk].r++});
  var semRows=Object.keys(porSem).sort().slice(-8).map(function(s){var v=porSem[s];return [s.slice(5),v.c,pct(v.r,v.c)+' resp.']});
  // segmento por conversão (#5)
  var segConv={};L.forEach(function(l){var k=l.Segmento||'(vazio)';segConv[k]=segConv[k]||{t:0,g:0};segConv[k].t++;if(l.Etapa==='Ganho')segConv[k].g++});
  var segConvRows=Object.keys(segConv).filter(function(k){return segConv[k].t>=2}).map(function(k){var v=segConv[k];return [k,v.g,pct(v.g,v.t)+' ('+v.g+'/'+v.t+')']}).sort(function(a,b){return (b[0]===0?0:b[1]/segConv[b[0]].t)-(a[0]===0?0:a[1]/segConv[a[0]].t)});
  var maxSegConv=Math.max.apply(null,segConvRows.map(function(r){return r[1]}).concat([1]));

  $('main').innerHTML='<div class="filters"><h2 style="margin:0">Dashboard comercial</h2><button class="btn sec sm" onclick="enviarResumo()">📧 Receber o resumo semanal agora</button><select style="margin-left:auto" onchange="PERIOD=+this.value;render()">'+[[30,'Últimos 30 dias'],[90,'Últimos 90 dias'],[0,'Tudo']].map(function(p){return '<option value="'+p[0]+'"'+(PERIOD===p[0]?' selected':'')+'>'+p[1]+'</option>'}).join('')+'</select></div>'+
  // KPIs
  '<div class="row">'+
   kpi('Leads no funil',ativos,'em andamento agora')+
   kpi('Contatos na semana',sem,'meta: '+D.metaContatosSemana)+
   kpi('Taxa de resposta geral',pct(respTot,contTot),respTot+' de '+contTot+' leads contatados')+
   kpi('Amostras enviadas',amostras,pct(amostras,L.length)+' dos leads')+
   kpi('Novos clientes',ganhos,'conversão '+pct(ganhos,L.length)+' · meta/mês: '+D.metaGanhosMes)+
   kpi('Tempo até fechar',tempo.length?Math.round(tempo.reduce(function(a,b){return a+b},0)/tempo.length)+' dias':'—','média, da entrada ao ganho')+
   kpi('Sem contato há 30d+',semCont.length,'leads ativos sem contato recente',semCont.length>5?'var(--verm)':'')+'</div>'+
  // Funil + Canal
  '<div class="row" style="margin-top:14px;align-items:flex-start">'+
   '<div class="card" style="flex:1;min-width:340px"><h3>Funil de conversão — taxa por etapa</h3>'+bars(fun)+'<div class="muted">Perdidos no período: '+perd+'</div></div>'+
   '<div class="card" style="flex:1;min-width:340px"><h3>Taxa de resposta por canal</h3>'+(canalRows.length?canalRows.map(function(r){return '<div class="brow"><div class="lb">'+esc(r[0])+'</div><div style="flex:1;background:#F4EBDA;border-radius:6px"><div class="bar" style="width:'+Math.max(r[2]/Math.max(r[1],1)*100,6)+'%;background:var(--verde2)">'+pct(r[2],r[1])+'</div></div><div class="rt">'+r[2]+' de '+r[1]+' leads</div></div>'}).join(''):'<div class="muted">Sem contatos no período.</div>')+
   '<h3 style="margin-top:16px">Quando muda de canal</h3>'+(migRows.length?migRows.map(function(r){return '<div class="brow"><div class="lb">'+esc(r[0])+'</div><div style="flex:1;background:#F4EBDA;border-radius:6px"><div class="bar" style="width:'+Math.max(r[2]/Math.max(r[1],1)*100,6)+'%;background:var(--laranja)">'+pct(r[2],r[1])+'</div></div><div class="rt">'+r[2]+' de '+r[1]+' responderam</div></div>'}).join(''):'<div class="muted">Nenhuma troca de canal.</div>')+'</div></div>'+
  // Tempo médio por etapa + Dia da semana
  '<div class="row" style="margin-top:14px;align-items:flex-start">'+
   '<div class="card" style="flex:1;min-width:320px"><h3>⏱ Tempo médio em cada etapa</h3>'+(tempoRows.length?bars(tempoRows,Math.max.apply(null,tempoRows.map(function(r){return r[1]})),'var(--azul)'):'<div class="muted">Sem histórico suficiente de mudanças de etapa ainda.</div>')+'</div>'+
   '<div class="card" style="flex:1;min-width:320px"><h3>📅 Quando recebemos respostas (dia da semana)</h3>'+bars(diaRows,Math.max.apply(null,porDia.concat([1])),'var(--lima)')+'</div></div>'+
  // Segmento conversão + Cidades
  '<div class="row" style="margin-top:14px;align-items:flex-start">'+
   '<div class="card" style="flex:1;min-width:320px"><h3>🏆 Segmentos com melhor conversão</h3>'+(segConvRows.length?segConvRows.map(function(r){return '<div class="brow"><div class="lb">'+esc(r[0])+'</div><div style="flex:1"><div class="bar" style="width:'+Math.max(r[1]/maxSegConv*100,4)+'%;background:var(--lima)">'+r[1]+'</div></div><div class="rt">'+r[2]+'</div></div>'}).join(''):'<div class="muted">Sem dados.</div>')+'</div>'+
   '<div class="card" style="flex:1;min-width:320px"><h3>📍 Top cidades com leads ativos</h3>'+bars(cidadeRows,0,'var(--azul)')+'</div></div>'+
  // Origem + Semana
  '<div class="row" style="margin-top:14px;align-items:flex-start">'+
   '<div class="card" style="flex:1;min-width:320px"><h3>Por origem</h3>'+bars(grp('Origem'),0,'var(--azul)')+'</div>'+
   '<div class="card" style="flex:1;min-width:320px"><h3>📈 Taxa de resposta por semana</h3>'+(semRows.length?bars(semRows,Math.max.apply(null,semRows.map(function(r){return r[1]}).concat([1])),'var(--verde2)'):'<div class="muted">Sem dados.</div>')+'</div></div>'+
  // Pessoas + Motivos
  '<div class="row" style="margin-top:14px;align-items:flex-start">'+
   '<div class="card" style="flex:1;min-width:320px"><h3>Contatos por pessoa</h3>'+bars(pessoa,0,'var(--verde)')+'</div>'+
   '<div class="card" style="flex:1;min-width:320px"><h3>Motivos de perda</h3>'+(motRows.length?bars(motRows,0,'var(--verm)'):'<div class="muted">Nenhum.</div>')+'</div></div>'+
  // Leads sem contato há X dias (#9)
  '<div class="card" style="margin-top:14px"><h3>🔔 Leads sem contato recente</h3>'+
  '<div class="filters" style="margin-bottom:8px"><span class="muted">Sem contato há mais de </span><select style="width:80px" onchange="window._xSC=+this.value;vDash()">'+[14,21,30,45,60].map(function(n){return '<option'+(xSC===n?' selected':'')+' value="'+n+'">'+n+'d</option>'}).join('')+'</select><span class="muted"> ('+semCont.length+' leads)</span></div>'+
  (semCont.length?'<div style="overflow:auto"><table><tr><th>Estabelecimento</th><th>Responsável</th><th>Etapa</th><th>Dias s/contato</th><th></th></tr>'+semCont.slice(0,20).map(function(x){return '<tr class="click" onclick="openLead(\''+x.l.ID+'\')"><td><b>'+esc(x.l.Estabelecimento)+'</b></td><td>'+esc(x.l['Responsável']||'—')+'</td><td>'+esc(x.l.Etapa)+'</td><td><span class="tag '+(x.d>30?'red':x.d>14?'yel':'gray')+'">'+( x.d===null?'nunca contactado':x.d+'d')+'</span></td><td><a href="#" class="muted" onclick="openLead(\''+x.l.ID+'\');return false">abrir</a></td></tr>'}).join('')+'</table></div>'+'<div class="muted" style="margin-top:6px">'+(semCont.length>20?'Mostrando 20 de '+semCont.length+'. Filtre por etapa na aba Leads para ver todos.':'')+'</div>':'<div class="muted">Todos os leads ativos tiveram contato recente. 🎉</div>')+'</div>'}

// ------------------------------------------------------------------ PÓS-VENDA
function followUpPV(id){
  var l=lead(id);if(!l)return;
  var dr=$('drawer');
  var canais=['WhatsApp','Instagram','E-mail','Ligação','Visita','Outro'];
  var vendas=['Ótimas — vendeu muito bem','Boas — saindo bem','Regulares — saindo devagar','Fracas — quase não vendeu','Não vendeu nada','Não souberam dizer'];
  var estoques=['Sim, tem bastante','Sim, mas está acabando','Não, zerou','Não soube informar'];
  var interesses=['Sim — quer pedir agora','Sim — mas ainda tem estoque','Talvez — vai retornar','Não agora','Não quer mais'];
  dr.innerHTML='<div class="top"><h2>📋 Follow-up pós-venda</h2><div style="font-size:12px;opacity:.85">'+esc(l.Estabelecimento)+' · '+esc(l.Segmento||'')+'</div></div>'+
  '<div class="body"><p class="muted" style="margin:0 0 12px">Preencha após o contato com o cliente. Essas respostas ficam salvas no histórico e ajudam a decidir próximos passos.</p>'+
  '<label>Canal do contato<select id="pvCanal">'+canais.map(function(c){return'<option>'+c+'</option>'}).join('')+'</select></label>'+
  '<h3 style="margin:16px 0 8px;color:var(--verde)">Perguntas guiadas</h3>'+
  '<label>📊 Como foram as vendas do produto desde o último pedido?<select id="pvVendas"><option value="">Selecione</option>'+vendas.map(function(v){return'<option>'+v+'</option>'}).join('')+'</select></label>'+
  '<label>📦 Ainda tem produto em estoque?<select id="pvEstoque"><option value="">Selecione</option>'+estoques.map(function(v){return'<option>'+v+'</option>'}).join('')+'</select></label>'+
  '<label>🔄 Interesse em novo pedido?<select id="pvInteresse" onchange="pvInteresseMudou()"><option value="">Selecione</option>'+interesses.map(function(v){return'<option>'+v+'</option>'}).join('')+'</select></label>'+
  '<div id="pvMotDiv" style="display:none"><label>⚠️ Motivo da queda / não recompra (opcional)<input id="pvMotivo" placeholder="ex.: temporada baixa, caixa curto, produto encalhado..."></label></div>'+
  '<label>💬 Observações livres / feedback do cliente<textarea id="pvObs" rows="3" placeholder="ex.: adoraram o sabor, mas querem formato em cubos; pediram desconto; esperam retorno do chef..."></textarea></label>'+
  '<h3 style="margin:16px 0 8px;color:var(--verde)">Próximo passo</h3>'+
  '<div class="grid2"><label class="full">O que fazer<input id="pvProx" placeholder="ex.: enviar proposta de pedido, ligar em 2 semanas, aguardar resposta do chef..."></label>'+
  '<label>Quando<input id="pvData" type="date" value="'+isoDay(new Date(Date.now()+7*864e5))+'"></label></div>'+
  '<div style="display:flex;gap:8px;margin-top:14px"><button class="btn" onclick="salvarFollowUpPV(\''+id+'\')">Salvar follow-up</button><button class="btn sec" onclick="closeDrawer()">Cancelar</button></div></div>';
  dr.classList.add('open');$('ov').classList.add('open');
}
function pvInteresseMudou(){
  var v=$('pvInteresse').value;
  $('pvMotDiv').style.display=(!v||v.indexOf('Sim')===0)?'none':'block';
}
function salvarFollowUpPV(id){
  var canal=$('pvCanal').value;
  var vendas=$('pvVendas').value;
  var estoque=$('pvEstoque').value;
  var interesse=$('pvInteresse').value;
  var motivo=$('pvMotivo')?$('pvMotivo').value:'';
  var obs=$('pvObs').value.trim();
  var prox=$('pvProx').value.trim();
  var data=$('pvData').value;
  var linhas=[];
  if(vendas)linhas.push('📊 Vendas: '+vendas);
  if(estoque)linhas.push('📦 Estoque: '+estoque);
  if(interesse)linhas.push('🔄 Interesse em repor: '+interesse);
  if(motivo)linhas.push('⚠️ Motivo da queda/não recompra: '+motivo);
  if(obs)linhas.push('💬 '+obs);
  var texto='[Follow-up pós-venda]\n'+linhas.join('\n');
  var resultado=interesse.indexOf('Sim — quer pedir')===0?'Interessado':interesse.indexOf('Sim — mas')===0?'Pediu para retornar depois':interesse.indexOf('Talvez')===0?'Pediu para retornar depois':interesse.indexOf('Não')===0?'Não tem interesse':'Não respondeu';
  if(!canal){toast('Escolha o canal');return;}
  OPEN=null;
  call('addActivity',{leadId:id,tipo:'Contato',canal:canal,resultado:resultado,texto:texto,proximoPasso:prox||undefined,dataProx:data||undefined}).then(function(r){after(r);closeDrawer();toast('Follow-up registrado ✓');go('posVenda')});
}

function vPosVenda(){
  var so=F.pvTodos?'':ME;
  var clientes=D.leads.filter(function(l){return l.Etapa==='Ganho'&&(!so||l['Responsável']===so)});
  clientes=clientes.map(function(l){
    var ds=diasSemContato(l);var vp=days(l['Data próximo passo']);
    var urg=0;
    if(vp!==null&&vp>0)urg=100+vp;
    else if(ds===null)urg=90;
    else if(ds>=30)urg=80+Math.min(ds,50);
    else if(ds>=14)urg=60+ds;
    else urg=ds||0;
    return{l:l,ds:ds,vp:vp,urg:urg};
  }).sort(function(a,b){return b.urg-a.urg});
  var urgentes=clientes.filter(function(x){return x.urg>=60});
  var semCont30=clientes.filter(function(x){return x.ds===null||x.ds>=30});
  var vencidos=clientes.filter(function(x){return x.vp!==null&&x.vp>0});
  function tagDs(x){if(x.ds===null)return'<span class="tag red">nunca contactado</span>';if(x.ds>30)return'<span class="tag red">'+x.ds+'d</span>';if(x.ds>14)return'<span class="tag yel">'+x.ds+'d</span>';return'<span class="tag gray">'+x.ds+'d</span>';}
  function tagVp(x){if(x.vp===null)return'<span class="tag gray">—</span>';if(x.vp>0)return'<span class="tag red">'+x.vp+'d de atraso</span>';if(x.vp===0)return'<span class="tag yel">hoje</span>';return'<span class="tag">em '+(-x.vp)+'d</span>';}
  function row(x){var l=x.l;return'<tr><td class="click" onclick="openLead(\''+l.ID+'\')"><b>'+esc(l.Estabelecimento)+'</b><div class="muted">'+esc([l.Segmento,l.Cidade].filter(String).join(' · '))+'</div></td><td>'+esc(l['Responsável']||'—')+'</td><td>'+tagDs(x)+'</td><td style="max-width:180px">'+esc(l['Próximo passo']||'—')+'</td><td>'+tagVp(x)+'</td><td><button class="btn sm" onclick="followUpPV(\''+l.ID+'\')">📋 Follow-up</button>'+(l.WhatsApp?'<a href="'+waLink(l.WhatsApp)+'" target="_blank" class="btn sm sec" style="margin-left:4px">📱</a>':'')+'</td></tr>';}
  $('main').innerHTML='<div class="filters"><h2 style="margin:0">Pós-venda — acompanhamento de clientes</h2><label class="muted" style="margin-left:auto"><input type="checkbox" '+(F.pvTodos?'checked':'')+' onchange="F.pvTodos=this.checked;render()"> ver o time todo</label></div>'+
  '<div class="row">'+
  '<div class="card kpi"><div class="l">Clientes ativos</div><div class="v">'+clientes.length+'</div><div class="s">status Ganho</div></div>'+
  '<div class="card kpi"><div class="l">Atenção urgente</div><div class="v" style="color:var(--verm)">'+urgentes.length+'</div><div class="s">14d+ sem contato ou atrasado</div></div>'+
  '<div class="card kpi"><div class="l">Sem contato 30d+</div><div class="v" style="color:var(--verm)">'+semCont30.length+'</div><div class="s">risco de churn</div></div>'+
  '<div class="card kpi"><div class="l">Follow-ups vencidos</div><div class="v" style="color:var(--laranja)">'+vencidos.length+'</div><div class="s">próximo passo atrasado</div></div>'+
  '</div>'+
  '<div class="card" style="margin-top:14px"><h3>🔥 Prioritários — contate agora</h3>'+
  (urgentes.length?'<div class="sug">'+urgentes.slice(0,8).map(function(x){var l=x.l;return'<div class="card"><div style="font-weight:700;font-size:15px">'+esc(l.Estabelecimento)+'</div><div class="muted">'+esc([l.Segmento,l.Cidade].filter(String).join(' · '))+'</div><div style="margin:6px 0;display:flex;gap:6px;flex-wrap:wrap">'+tagDs(x)+tagVp(x)+'</div><div class="muted" style="margin-bottom:8px">'+esc(l['Próximo passo']||'Sem próximo passo definido')+'</div><div class="acts"><button class="btn sm" onclick="followUpPV(\''+l.ID+'\')">📋 Registrar follow-up</button>'+(l.WhatsApp?'<a href="'+waLink(l.WhatsApp)+'" target="_blank" class="btn sm sec">📱 WhatsApp</a>':'')+(l.Instagram?'<a href="'+igLink(l.Instagram)+'" target="_blank" class="btn sm sec">📷 Instagram</a>':'')+'</div></div>'}).join('')+'</div>':'<div class="muted">Nenhum urgente no momento. 🎉</div>')+'</div>'+
  '<div class="card" style="margin-top:14px"><h3>Lista completa · ordenado por urgência</h3>'+
  (clientes.length?'<div style="overflow:auto"><table><tr><th>Cliente</th><th>Resp.</th><th>Último contato</th><th>Próximo passo</th><th>Data/prazo</th><th></th></tr>'+clientes.map(row).join('')+'</table></div>':'<div class="muted">Nenhum cliente ainda. Quando um lead chega em Ganho, aparece aqui automaticamente.</div>')+'</div>';
}

document.addEventListener('keydown',function(e){if(e.key==='Escape')closeDrawer()});
load();
</script>
