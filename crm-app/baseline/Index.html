<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<base target="_top">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--verde:#1E5E4A;--verde2:#2E7D5F;--lima:#A5C93A;--laranja:#F2572B;--creme:#FFF6E9;--linha:#EADFCB;--cinza:#6B6B6B;--txt:#1d2b25;--branco:#fff;--verm:#E5484D;--amar:#F2C94C;--azul:#4A7BF7}
*{box-sizing:border-box}
body{margin:0;font-family:Montserrat,Arial,sans-serif;background:var(--creme);color:var(--txt);font-size:14px}
header{background:var(--verde);color:#fff;display:flex;align-items:center;gap:16px;padding:10px 20px;position:sticky;top:0;z-index:20;flex-wrap:wrap}
header .logo{font-weight:700;font-size:18px;letter-spacing:.3px}
header .logo span{color:var(--lima)}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{background:transparent;border:0;color:#CFE3D6;font:600 13px Montserrat;padding:8px 12px;border-radius:8px;cursor:pointer;position:relative}
nav button.on{background:rgba(255,255,255,.14);color:#fff}
nav .badge{background:var(--laranja);color:#fff;border-radius:10px;padding:1px 6px;font-size:10px;margin-left:4px}
.sidebar{position:fixed;top:0;left:-260px;width:240px;height:100%;background:#fff;box-shadow:2px 0 14px rgba(0,0,0,.18);transition:left .2s;z-index:31;padding:70px 0 20px;overflow-y:auto}
.sidebar.open{left:0}
.sidebar button{display:block;width:100%;text-align:left;background:transparent;border:0;padding:12px 20px;font:600 14px Montserrat;color:var(--txt);cursor:pointer}
.sidebar button.on{background:var(--creme);color:var(--verde)}
.sidebar button small{display:block;font-weight:400;font-size:11px;color:var(--cinza);margin-top:2px}
.sidebar-ov{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:30;display:none}
.sidebar-ov.open{display:block}
.qr-wrap{margin-bottom:2px}
.qr-row{display:flex;gap:4px;flex-wrap:wrap;padding:4px 2px 10px}
.qr-btn{border:1px solid var(--linha);background:#fff;border-radius:14px;padding:5px 10px;font:600 11px Montserrat;cursor:pointer;color:var(--txt)}
.qr-btn:active{background:var(--creme)}
@media(max-width:700px){.qr-btn{font-size:12px;padding:7px 11px}}
header .me{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:14px;font-weight:700}
header select{font:700 15px Montserrat;border-radius:22px;border:2px solid #fff;padding:8px 14px;background:var(--lima);color:var(--verde);min-width:170px;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.2)}header select.vazio{background:var(--laranja);color:#fff;animation:pulse 1.5s infinite}@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(242,87,43,.35)}}
main{padding:18px 20px;max-width:1600px;margin:0 auto}
h2{margin:6px 0 14px;color:var(--verde);font-size:18px}
h3{margin:0 0 10px;color:var(--laranja);font-size:13px;text-transform:uppercase;letter-spacing:.5px}
.row{display:flex;gap:14px;flex-wrap:wrap}
.card{background:#fff;border-radius:12px;padding:14px 16px;box-shadow:0 1px 0 var(--linha);border:1px solid var(--linha)}
.kpi{flex:1;min-width:160px}
.kpi .l{font-size:11px;color:var(--cinza);font-weight:700;text-transform:uppercase}
.kpi .v{font-size:28px;font-weight:700;color:var(--verde);margin-top:4px}
.kpi .s{font-size:11px;color:var(--cinza);margin-top:2px}
.btn{background:var(--verde);color:#fff;border:0;border-radius:8px;padding:8px 14px;font:600 13px Montserrat;cursor:pointer}
.btn.sec{background:#fff;color:var(--verde);border:1px solid var(--verde)}
.btn.lar{background:var(--laranja)}
.btn.sm{padding:5px 10px;font-size:12px}
.btn:disabled{opacity:.5}
input,select,textarea{font:500 13px Montserrat;border:1px solid #d9cfbd;border-radius:8px;padding:7px 9px;background:#fff;color:var(--txt)}
textarea{width:100%;min-height:70px;resize:vertical}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
/* kanban */
.board{display:flex;gap:12px;overflow-x:auto;padding-bottom:10px;align-items:flex-start}
.col{background:#F4EBDA;border-radius:12px;min-width:250px;width:250px;flex-shrink:0;display:flex;flex-direction:column;max-height:calc(100vh - 190px)}
.col .hd{padding:10px 12px;font-weight:700;font-size:13px;display:flex;justify-content:space-between;border-top:4px solid var(--c);border-radius:12px 12px 0 0}
.col .hd small{color:var(--cinza);font-weight:600}
.col .bd{padding:6px 8px 10px;overflow-y:auto;flex:1;min-height:60px}
.col.over{outline:2px dashed var(--verde)}
.lc{background:#fff;border-radius:10px;padding:9px 10px;margin-bottom:8px;cursor:pointer;border:1px solid var(--linha);box-shadow:0 1px 2px rgba(0,0,0,.04)}
.lc:hover{border-color:var(--verde)}
.lc.venc{border-left:3px solid var(--verm);background:#FFF8F8}
.lc .n{font-weight:700;font-size:13px}
.lc .m{font-size:11px;color:var(--cinza);margin-top:3px}
.lc .f{display:flex;justify-content:space-between;align-items:center;margin-top:6px;font-size:11px}
.av{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:var(--lima);color:var(--verde);font-weight:700;font-size:10px}
.tag{display:inline-block;padding:2px 7px;border-radius:10px;font-size:10px;font-weight:700;background:#EEF5DC;color:var(--verde)}
.tag.red{background:#F8D7DA;color:#a61b22}.tag.yel{background:#FFF3CD;color:#7a5b00}.tag.blue{background:#E3E8FF;color:#2849b8}.tag.gray{background:#eee;color:#555}
/* tabela */
table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden}
th{background:var(--verde);color:#fff;text-align:left;font-size:12px;padding:8px;position:sticky;top:0}
td{border-bottom:1px solid var(--linha);padding:7px 8px;font-size:13px;vertical-align:top}
tr.click:hover td{background:#FBF7EE;cursor:pointer}
/* drawer */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:40;display:none}
.drawer{position:fixed;right:0;top:0;bottom:0;width:min(560px,100%);background:#fff;z-index:50;box-shadow:-4px 0 20px rgba(0,0,0,.15);transform:translateX(100%);transition:.2s;display:flex;flex-direction:column}
.drawer.open{transform:none}.ov.open{display:block}
.drawer .top{background:var(--verde);color:#fff;padding:14px 18px}
.drawer .top h2{color:#fff;margin:0 0 4px}
.drawer .body{padding:14px 18px;overflow-y:auto;flex:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px}
.grid2 label{font-size:11px;font-weight:700;color:var(--cinza);display:flex;flex-direction:column;gap:3px}
.grid2 .full{grid-column:1/3}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.acts a{text-decoration:none}
.tl{border-left:2px solid var(--linha);margin-left:6px;padding-left:12px}
.tl .it{margin-bottom:12px;position:relative}
.tl .it:before{content:'';position:absolute;left:-18px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--c,var(--lima))}
.tl .h{font-size:11px;color:var(--cinza)}
.tl .t{font-size:13px;white-space:pre-wrap}
.box{background:#FBF7EE;border-radius:10px;padding:10px;margin:10px 0}
.muted{color:var(--cinza);font-size:12px}
.bar{height:26px;border-radius:6px;background:var(--verde);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;padding:0 8px;white-space:nowrap;min-width:28px}
.brow{display:flex;align-items:center;gap:10px;margin:6px 0}
.brow .lb{width:170px;font-size:12px;font-weight:600;flex-shrink:0}
.brow .rt{font-size:12px;color:var(--cinza);white-space:nowrap}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--verde);color:#fff;padding:10px 16px;border-radius:10px;font-weight:600;z-index:90;display:none}
.loading{position:fixed;inset:0;background:rgba(255,246,233,.7);display:flex;align-items:center;justify-content:center;z-index:80;font-weight:700;color:var(--verde)}
.feed .it{background:#fff;border:1px solid var(--linha);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.mention{background:#FFE7DD;color:#b3360f;border-radius:4px;padding:0 3px;font-weight:700}
.sug{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.hint{background:#EEF5DC;border-radius:10px;padding:10px 12px;font-size:12px;margin-bottom:12px}
@media(max-width:700px){main{padding:12px}.col{min-width:220px;width:220px}.grid2{grid-template-columns:1fr}.grid2 .full{grid-column:1}.brow .lb{width:110px}}
</style>
</head>
<body>
<header>
  <button class="btn sm" onclick="toggleSidebar()" title="Mais seções" style="background:rgba(255,255,255,.14);color:#fff">☰ Mais</button>
  <div class="logo">Morphê <span>Comercial</span></div>
  <nav id="nav"></nav>
  <div class="me"><button class="btn lar sm" onclick="quickAdd()">+ Adicionar lead</button> 👤 Você: <select id="meSel"></select></div>
</header>
<aside class="sidebar" id="sidebar"></aside>
<div class="sidebar-ov" id="sidebarOv" onclick="toggleSidebar()"></div>
<main id="main"></main>
<div class="ov" id="ov" onclick="closeDrawer()"></div>
<div class="drawer" id="drawer"></div>
<div class="toast" id="toast"></div>
<div class="loading" id="loading">Carregando…</div>

<script>
var D = null, VIEW = 'hoje', ME = '', F = {q:'', resp:'', seg:'', orig:'', pvTodos:false}, OPEN = null, DRAG = null, PERIOD = 90;
var TABS = [['hoje','Hoje'],['funil','Funil'],['leads','Leads'],['sug','Sugeridos'],['buscar','Buscar no Maps'],['mural','Mural'],['dash','Dashboard'],['posVenda','Pós-venda 🔄']];
var SIDEBAR = [
  ['carteira','📊 Carteira e Churn','risco por cliente, motivos de queda'],
  ['previsao','🔮 Previsão e Risco','funil ponderado, gargalos por etapa'],
  ['sellin','📦 Sell-in / Sell-out','giro e estoque estimado por PDV'],
  ['icp','🎯 Prospecção e ICP','score de aderência, fila de contato']
];
function toggleSidebar(){$('sidebar').classList.toggle('open');$('sidebarOv').classList.toggle('open')}
function renderSidebar(){$('sidebar').innerHTML=SIDEBAR.map(function(t){return '<button class="'+(VIEW===t[0]?'on':'')+'" onclick="go(\''+t[0]+'\');toggleSidebar()">'+t[1]+'<small>'+t[2]+'</small></button>'}).join('')}
function vEmConstrucao(titulo,fase,desc){$('main').innerHTML='<h2>'+titulo+'</h2><div class="card" style="max-width:640px"><p style="color:var(--cinza)">🚧 Em construção — chega na '+fase+' do projeto.</p><p>'+desc+'</p></div>'}
function vCarteira(){vEmConstrucao('📊 Carteira e Churn','Fase 2','Risco por cliente (dias desde o último pedido vs. ciclo padrão, variação de volume, follow-ups sem resposta), ficha de adesão por cliente e simulação de margem.')}
function vPrevisao(){vEmConstrucao('🔮 Previsão e Risco','Fase 2','Funil ponderado por etapa + recompra esperada, gargalos por etapa (SLAs do POP), conversão, tempo médio por etapa e performance por responsável.')}
function vSellin(){vEmConstrucao('📦 Sell-in / Sell-out','Fase 2','Registro de sell-out por cliente, giro, estoque estimado (sell-in acumulado − sell-out) e alertas de estoque alto/baixo.')}
function vIcp(){vEmConstrucao('🎯 Prospecção e ICP','Fase 3','Score de aderência ao perfil de cliente ideal (ICP) e fila "falar hoje com estes N", usando os dados já coletados via Google Maps.')}
var COR = {'Sugerido':'#B9A6E0','Mapeado':'#9E9E9E','Contato feito':'#4A7BF7','Respondeu':'#2EA3C7','Amostra enviada':'#F2C94C','Negociação':'#F2572B','Ganho':'#2E9E5B','Perdido':'#E5484D','Frio':'#9E9E9E'};
var RESPONDEU = ['Respondeu','Interessado','Pediu valores / material','Pediu amostra','Encaminhou para outro contato/canal','Pediu para retornar depois','Sem interesse'];

function $(id){return document.getElementById(id)}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function toast(m){var t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(function(){t.style.display='none'},2600)}
function busy(b){$('loading').style.display=b?'flex':'none'}
function call(fn){var args=[].slice.call(arguments,1);busy(true);return new Promise(function(ok,ko){google.script.run.withSuccessHandler(function(r){busy(false);ok(r)}).withFailureHandler(function(e){busy(false);alertErr(e);ko(e)})[fn].apply(null,args)})}
// Igual ao call(), mas sem bloquear a tela com o "Carregando…" — usado quando a tela já foi
// atualizada de forma otimista e o usuário pode continuar usando o app enquanto salva atrás.
function callSilent(fn){var args=[].slice.call(arguments,1);return new Promise(function(ok,ko){google.script.run.withSuccessHandler(ok).withFailureHandler(function(e){alertErr(e);ko(e)})[fn].apply(null,args)})}
function alertErr(e){toast('Erro: '+(e&&e.message||e))}
function d(s){if(!s)return null;var x=new Date(String(s).length<=10?s+'T00:00:00':s);return isNaN(x)?null:x}
function fmt(s){var x=d(s);return x?('0'+x.getDate()).slice(-2)+'/'+('0'+(x.getMonth()+1)).slice(-2):''}
function fmtH(s){var x=d(s);return x?fmt(s)+' '+('0'+x.getHours()).slice(-2)+':'+('0'+x.getMinutes()).slice(-2):''}
function today(){var t=new Date();t.setHours(0,0,0,0);return t}
function days(s){var x=d(s);if(!x)return null;x.setHours(0,0,0,0);return Math.round((today()-x)/864e5)}
function ini(n){return String(n||'?').trim().slice(0,2).toUpperCase()}
function isoDay(dt){return dt.getFullYear()+'-'+('0'+(dt.getMonth()+1)).slice(-2)+'-'+('0'+dt.getDate()).slice(-2)}
function lead(id){return D.leads.filter(function(l){return String(l.ID)===String(id)})[0]}
function atvOf(id){return D.atividades.filter(function(a){return String(a['Lead ID'])===String(id)}).sort(function(a,b){return a.Data<b.Data?1:-1})}
function ativo(l){return ['Sugerido','Ganho','Perdido','Frio'].indexOf(l.Etapa)<0}
function waLink(n,msg){var p=String(n||'').replace(/\D/g,'');if(!p)return '';if(p.length<=11)p='55'+p;return 'https://wa.me/'+p+(msg?'?text='+encodeURIComponent(msg):'')}
function igLink(h){h=String(h||'').trim();if(!h)return '';if(/^http/.test(h))return h;return 'https://instagram.com/'+h.replace(/^@/,'')}
function opts(list,sel,blank){return (blank!==undefined?'<option value="">'+blank+'</option>':'')+list.map(function(x){return '<option'+(x===sel?' selected':'')+'>'+esc(x)+'</option>'}).join('')}

function load(){busy(true);google.script.run.withSuccessHandler(function(r){busy(false);setData(r);render()}).withFailureHandler(function(e){busy(false);$('main').innerHTML='<div class="card">Não foi possível carregar: '+esc(e.message||e)+'</div>'}).getAll()}
function setData(r){D=r;var saved='';try{saved=localStorage.getItem('morphe_me')||''}catch(e){}
  ME=(r.me&&r.me.nome)||saved||'';var s=$('meSel');s.innerHTML=opts(D.users.map(function(u){return u.nome}),ME,'👤 Escolha seu nome');s.className=ME?'':'vazio';s.onchange=function(){ME=s.value;s.className=ME?'':'vazio';try{localStorage.setItem('morphe_me',ME)}catch(e){};render()};}
function upsertById_(arr,item){if(!item)return;var i=arr.findIndex(function(x){return x.ID===item.ID});if(i>=0)arr[i]=item;else arr.unshift(item)}
// Aplica a mudança na tela ANTES da resposta do servidor (otimista) e desfaz se a chamada falhar.
function otimista(leadId,patch,fn){var l=lead(leadId);var antes=l?Object.assign({},l):null;if(l){Object.assign(l,patch);render()}return fn().catch(function(e){if(l&&antes){Object.assign(l,antes);render()}throw e})}
// Registro rápido de respostas: 1 toque com o resultado (substitui a automação do WhatsApp).
// Observação é opcional; não muda a etapa automaticamente (isso é feito arrastando no kanban).
var RESPOSTAS_RAPIDAS=[['✅ Comprou','Comprou'],['📅 Vai comprar','Vai comprar (agendado)'],['⏸️ Adiou','Adiou / pediu p/ voltar depois'],['🔇 Não respondeu','Não respondeu'],['❌ Recusou','Recusou']];
function cardAcaoRapida(l){return '<div class="qr-wrap">'+card(l)+'<div class="qr-row">'+RESPOSTAS_RAPIDAS.map(function(r){return '<button class="qr-btn" onclick="event.stopPropagation();respostaRapida(\''+l.ID+'\',\''+r[1]+'\')">'+r[0]+'</button>'}).join('')+'</div></div>'}
function respostaRapida(id,resultado){
  var obs=prompt('Observação (opcional) — '+resultado,'');
  if(obs===null)return;
  var novaEtapa=resultado==='Comprou'?'Ganho':undefined;
  var patch={'Último contato':new Date().toISOString()};if(novaEtapa)patch.Etapa=novaEtapa;
  otimista(id,patch,function(){return callSilent('addActivity',{leadId:id,tipo:'Contato',canal:'WhatsApp',resultado:resultado,texto:obs||'',novaEtapa:novaEtapa})}).then(function(r){after(r);toast(novaEtapa?'Registrado: Comprou 🎉 (movido para Ganho)':'Registrado: '+resultado)})
}
function otimistaAtv(atvId,patch,fn){var a=D.atividades.find(function(x){return x.ID===atvId});var antes=a?Object.assign({},a):null;if(a){Object.assign(a,patch);render()}return fn().catch(function(e){if(a&&antes){Object.assign(a,antes);render()}throw e})}
// Mescla a resposta enxuta do backend (só o item que mudou) no estado local D, em vez de
// substituir tudo — evita reler+redesenhar leads/atividades inteiros em toda ação.
function merge(r){if(!r)return;Object.keys(r).forEach(function(k){if(k==='leads'||k==='atividades')return;D[k]=r[k]});(r.leads||[]).forEach(function(l){upsertById_(D.leads,l)});(r.atividades||[]).forEach(function(a){upsertById_(D.atividades,a)})}
function after(r){merge(r);render();if(OPEN)openLead(OPEN)}

function renderNav(){var nSug=D.leads.filter(function(l){return l.Etapa==='Sugerido'}).length;var nMe=pendentes(ME).length;
  var nVenc=D.leads.filter(function(l){var x=days(l['Data próximo passo']);return ativo(l)&&x!==null&&x>0&&(!ME||l['Responsável']===ME)}).length;
  var nPV=D.leads.filter(function(l){if(l.Etapa!=='Ganho')return false;var ds=diasSemContato(l);var vp=days(l['Data próximo passo']);return (vp!==null&&vp>0)||(ds===null||ds>=30);}).length;
  $('nav').innerHTML=TABS.map(function(t){var b='';if(t[0]==='sug'&&nSug)b='<span class="badge">'+nSug+'</span>';if(t[0]==='hoje'&&nVenc)b='<span class="badge" style="background:var(--verm)">'+nVenc+' venc.</span>';else if(t[0]==='hoje'&&nMe)b='<span class="badge">'+nMe+'</span>';else if(t[0]==='posVenda'&&nPV)b='<span class="badge" style="background:var(--laranja)">'+nPV+'</span>';return '<button class="'+(VIEW===t[0]?'on':'')+'" onclick="go(\''+t[0]+'\')">'+t[1]+b+'</button>'}).join('')}
function go(v){VIEW=v;render();window.scrollTo(0,0)}
function render(){if(!D)return;renderNav();renderSidebar();({hoje:vHoje,funil:vFunil,leads:vLeads,sug:vSug,buscar:vBuscar,mural:vMural,dash:vDash,posVenda:vPosVenda,carteira:vCarteira,previsao:vPrevisao,sellin:vSellin,icp:vIcp})[VIEW]();if(VIEW==='dash')montarMetaCard()}
// Meta de volume (kg): card anexado ao Dashboard sem tocar no HTML gerado por vDash().
function montarMetaCard(){
  $('main').insertAdjacentHTML('beforeend','<div class="card" id="metaCard" style="margin-top:14px;max-width:640px"><h3>🎯 Meta de volume (kg)</h3><div class="muted">Carregando…</div></div>');
  call('metaProgresso').then(renderMetaCard).catch(function(){});
}
function renderMetaCard(m){
  var el=$('metaCard');if(!el)return;
  var pct=Math.round((m.progresso||0)*100);
  el.innerHTML='<h3>🎯 Meta de volume (kg)</h3>'+
    '<div style="display:flex;justify-content:space-between;font-size:13px;color:var(--cinza)"><span>'+Math.round(m.kgAtingido).toLocaleString('pt-BR')+' kg de '+Math.round(m.metaKg).toLocaleString('pt-BR')+' kg</span><span>'+pct+'%</span></div>'+
    '<div style="background:var(--linha);border-radius:8px;height:10px;margin:6px 0 10px;overflow:hidden"><div style="background:var(--lima);height:100%;width:'+Math.min(100,pct)+'%"></div></div>'+
    '<div style="font-size:12px;color:var(--cinza)">Ritmo até agora: '+m.ritmoAtualDia+' kg/dia · média por cliente ativo: '+m.kgPorClienteMes+' kg/mês</div>'+
    '<div style="font-size:12px;margin-top:4px">📈 Previsão pra bater a meta, com a carteira atual: '+(m.novosClientesRealista===null?'<b>sem dados suficientes de clientes ativos pra estimar</b>':'<b>'+m.novosClientesRealista+' novo(s) cliente(s)</b> nesse perfil (realista) · <b>'+m.novosClientesGordura+'</b> com margem de segurança (+30%)')+'</div>'+
    '<details style="margin-top:10px"><summary style="cursor:pointer;font-size:12px;color:var(--azul)">editar meta</summary>'+
    '<div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap;align-items:end">'+

var GEN=['restaurante','emporio','emporium','cozinha','vegana','vegano','vegan','veg','vegetariano','vegetariana','vegetal','natural','naturais','produtos','cafe','cafeteria','bistro','bar','loja','mercado','supermercado','supermercados','hortifruti','comida','culinaria','plant','based','delicias','casa','espaco','store','food','foods','market','saudavel','saudaveis','granel','atelie','organicos','organico','sao','paulo','campinas','maria','santa','verde','vida','grao','graos','terra','mundo','sabor','sabores'];
function nrm(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')}
function toks(s){return nrm(s).replace(/[^a-z0-9 ]/g,' ').split(/\s+/).map(function(w){return w.replace(/(.)\1+/g,'$1')}).filter(function(w){return w.length>=4&&GEN.indexOf(w)<0})}
function cmp(s){return nrm(s).replace(/[^a-z0-9]/g,'').replace(/(.)\1+/g,'$1')}
function igH(h){h=nrm(h).trim();var m=h.match(/instagram\.com\/([^/?#\s]+)/);if(m)h=m[1];return h.replace(/^@/,'')}
function telD(t){var x=String(t||'').replace(/\D/g,'');if(x.length>11&&x.indexOf('55')===0)x=x.slice(2);return x.length>=10?x:''}
function parecidos(o,ignId){var n=cmp(o.Estabelecimento),tk=toks(o.Estabelecimento),g=igH(o.Instagram),f=telD(o.WhatsApp||o.Telefone);
  return D.leads.filter(function(l){if(l.ID===(ignId||o.ID)||l.Etapa==='Sugerido'&&o.Etapa==='Sugerido')return false;var m=cmp(l.Estabelecimento);
    if(n&&m&&(n===m||(n.length>=6&&m.indexOf(n)>=0)||(m.length>=6&&n.indexOf(m)>=0)))return true;
    if(g&&igH(l.Instagram)===g)return true;if(f&&(telD(l.WhatsApp)===f||telD(l.Telefone)===f))return true;
    var t2=toks(l.Estabelecimento);return tk.some(function(w){return t2.indexOf(w)>=0})}).slice(0,4)}
function removerSug(id){call('removerSugerido',id).then(function(r){after(r);toast('Sugestão removida')})}

// ---------------- ADIÇÃO RÁPIDA
var QA_MODE='um';
/* entende o que foi colado: @insta, link do insta, telefone, e-mail, site */
function parseContato(s){var o={};s=String(s||'');var tm=s.match(/(\+?55\s?)?\(?\d{2}\)?[\s.-]?9?\d{4}[\s.-]?\d{4}/);if(tm&&telD(tm[0])){o.WhatsApp=tm[0].trim();s=s.replace(tm[0],' ')}s.split(/[\s,;|]+/).forEach(function(p){if(!p)return;
  if(/instagram\.com\//i.test(p)||/^@[\w.]+$/.test(p))o.Instagram='@'+igH(p);
  else if(/^[\w.+-]+@[\w-]+\.[\w.]+$/.test(p))o['E-mail']=p;
  else if(/^https?:\/\//i.test(p)||/^www\./i.test(p))o.Site=p;
  else if(telD(p))o.WhatsApp=p});return o}
function parseLinha(line){var parts=line.split(/\t|;|,(?![^(]*\))| - | – /).map(function(x){return x.trim()}).filter(String);if(!parts.length)return null;
  var o={Estabelecimento:''},resto=[];parts.forEach(function(p){var c=parseContato(p);if(Object.keys(c).length&&p.split(/\s+/).length<=3){Object.keys(c).forEach(function(k){o[k]=c[k]})}else resto.push(p)});
  if(!resto.length&&o.Instagram)resto.push(o.Instagram.slice(1));o.Estabelecimento=resto.shift()||'';if(resto.length)o.Cidade=resto.shift();if(resto.length)o['Observações']=resto.join(' · ');return o.Estabelecimento?o:null}
function quickAdd(){OPEN=null;var dr=$('drawer');var et=['Mapeado','Contato feito','Respondeu','Amostra enviada','Negociação'];
  dr.innerHTML='<div class="top"><h2>Adicionar lead</h2><div style="font-size:12px;opacity:.85">Rápido: só o nome já basta. O sistema avisa se o lead já existe.</div></div><div class="body">'+
  '<div class="acts"><button class="btn sm '+(QA_MODE==='um'?'':'sec')+'" onclick="QA_MODE=\'um\';quickAdd()">Um lead</button><button class="btn sm '+(QA_MODE==='lista'?'':'sec')+'" onclick="QA_MODE=\'lista\';quickAdd()">Colar uma lista</button></div>'+
  (QA_MODE==='um'?
   '<div class="grid2"><label class="full">Nome do estabelecimento *<input id="qNome" oninput="qaCheck()" placeholder="ex.: Empório Verde Vida"></label>'+
   '<label class="full">Instagram, WhatsApp, e-mail ou link (cole qualquer um)<input id="qCont" oninput="qaCheck()" placeholder="@emporioverde  ou  11 99999-9999  ou  link do Instagram"></label>'+
   '<div class="full muted" id="qParse"></div><div class="full" id="qDup"></div>'+
   '<label>Cidade<input id="qCid" placeholder="São Paulo, SP"></label><label>Segmento<select id="qSeg">'+opts(D.segmentos,'','(adivinhar pelo nome)')+'</select></label>'+
   '<label>Situação<select id="qEt">'+opts(et,'Mapeado')+'</select></label><label>Origem<select id="qOri">'+opts(D.origens,'Prospecção ativa')+'</select></label>'+
   '<label>Responsável<select id="qResp">'+opts(D.users.map(function(u){return u.nome}),ME,'—')+'</select></label><label>Canal do 1º contato<select id="qCan">'+opts(D.canais,'Instagram')+'</select></label>'+
   '<label class="full">Observação<input id="qObs"></label></div>'+
   '<div class="acts"><button class="btn" onclick="qaSalvar(false)">Salvar</button><button class="btn sec" onclick="qaSalvar(true)">Salvar e adicionar outro</button><a href="#" class="muted" style="align-self:center" onclick="newLeadFull();return false">formulário completo</a></div>'
  :
   '<div class="hint">Cole <b>um lead por linha</b>. Pode ser só o nome, ou nome + @instagram/telefone + cidade, separados por vírgula ou ponto e vírgula. Dá para copiar direto de uma planilha.<br><span class="muted">Ex.: <code>Empório Verde, @emporioverde, Campinas</code> · <code>Casa Vegana; 11 98888-7777</code> · <code>instagram.com/raizesveg</code></span></div>'+
   '<textarea id="qLista" style="min-height:180px" oninput="qaPrev()" placeholder="Empório Verde, @emporioverde, Campinas&#10;Casa Vegana; 11 98888-7777"></textarea>'+
   '<div class="grid2" style="margin-top:8px"><label>Situação de todos<select id="qEt">'+opts(et,'Mapeado')+'</select></label><label>Origem<select id="qOri">'+opts(D.origens,'Prospecção ativa')+'</select></label>'+
   '<label>Responsável<select id="qResp">'+opts(D.users.map(function(u){return u.nome}),ME,'—')+'</select></label><label>Canal do 1º contato<select id="qCan">'+opts(D.canais,'Instagram')+'</select></label></div>'+
   '<div id="qPrev" style="margin-top:10px"></div><div class="acts"><button class="btn" onclick="qaLista()">Adicionar todos</button></div>')+
  '<div class="acts"><button class="btn sec" onclick="closeDrawer()">Fechar</button></div></div>';
  dr.classList.add('open');$('ov').classList.add('open');setTimeout(function(){var f=$('qNome')||$('qLista');if(f)f.focus()},250)}
function qaCheck(){var c=parseContato($('qCont').value);var lab={Instagram:'📷',WhatsApp:'📱','E-mail':'✉️',Site:'🌐'};
  $('qParse').innerHTML=Object.keys(c).map(function(k){return lab[k]+' '+esc(c[k])}).join(' · ');
  if(c.Instagram&&!$('qNome').value.trim())$('qNome').placeholder=c.Instagram.slice(1);
  var nome=$('qNome').value.trim()||(c.Instagram?c.Instagram.slice(1):'');var p=nome.length>=3||c.Instagram||c.WhatsApp?parecidos({Estabelecimento:nome,Instagram:c.Instagram,WhatsApp:c.WhatsApp}):[];
  $('qDup').innerHTML=p.length?'<div class="hint" style="background:#FFF3CD;margin:0">⚠️ Já existe algo parecido: '+p.map(function(l){return '<a href="#" onclick="openLead(\''+l.ID+'\');return false"><b>'+esc(l.Estabelecimento)+'</b></a> ('+esc(l.Etapa)+(l['Responsável']?', '+esc(l['Responsável']):'')+')'}).join(', ')+'</div>':''}
function qaObj(base){return Object.assign(base,{Etapa:$('qEt').value,Origem:$('qOri').value,'Responsável':$('qResp').value||ME,canal:$('qCan').value})}
function qaSalvar(outro){var c=parseContato($('qCont').value);var nome=$('qNome').value.trim()||(c.Instagram?c.Instagram.slice(1):'');if(!nome){toast('Coloque o nome');return}
  var o=qaObj(Object.assign({Estabelecimento:nome,Cidade:$('qCid').value.trim(),Segmento:$('qSeg').value,'Observações':$('qObs').value.trim()},c));
  call('addLeads',[o]).then(function(r){setData(r);render();if(r.ignorados.length){toast('Não adicionado: '+r.ignorados[0]);return}toast('✓ '+nome+' adicionado');if(outro)quickAdd();else closeDrawer()})}
function qaPrev(){var ls=$('qLista').value.split(/\n/).map(parseLinha).filter(Boolean);
  $('qPrev').innerHTML=ls.length?'<div class="muted" style="margin-bottom:4px">'+ls.length+' lead(s) encontrados:</div><table><tr><th>Nome</th><th>Contato</th><th>Cidade</th><th></th></tr>'+ls.map(function(o){var p=parecidos(o);return '<tr><td>'+esc(o.Estabelecimento)+'</td><td>'+esc([o.Instagram,o.WhatsApp,o['E-mail']].filter(Boolean).join(' '))+'</td><td>'+esc(o.Cidade||'')+'</td><td>'+(p.length?'<span class="tag yel">parecido: '+esc(p[0].Estabelecimento)+'</span>':'<span class="tag">novo</span>')+'</td></tr>'}).join('')+'</table><div class="muted">Os iguais (mesmo nome, @ ou telefone) são pulados automaticamente. Os "parecidos" entram, mas confira.</div>':''}
function qaLista(){var ls=$('qLista').value.split(/\n/).map(parseLinha).filter(Boolean);if(!ls.length){toast('Cole pelo menos uma linha');return}
  call('addLeads',ls.map(function(o){return qaObj(o)})).then(function(r){setData(r);render();closeDrawer();toast(r.criados.length+' adicionado(s)'+(r.ignorados.length?' · '+r.ignorados.length+' já existiam':''));if(r.ignorados.length)setTimeout(function(){alert('Já existiam (não duplicados):\n'+r.ignorados.join('\n'))},300)})}

// ---------------- MODELOS DE MENSAGEM
var TPL_DEF=[{nome:'1º contato',texto:'Oi{contato}! Aqui é {eu}, da Morphê 🌱 Somos o primeiro análogo vegetal de salmão em posta do Brasil. Posso mandar nossa tabela e uma amostra para o {estabelecimento}?'}];
function modelos(){var ms=(D.modelos&&D.modelos.length)?D.modelos:TPL_DEF;var dono=function(t){var m=String(t.nome).match(/\(([^)]+)\)\s*$/);return m?m[1].trim():''};var meus=ms.filter(function(t){return dono(t)&&dono(t)===ME});return meus.concat(ms.filter(function(t){return !dono(t)}))}
function tplTexto(l){var i=+(($('tplSel')||{}).value||0),t=modelos().at(i)||modelos().at(0);var pessoa=String(l['Contato (pessoa)']||'').replace(/\(.*\)/,'').trim().split(/\s+/).at(0)||'';
  var hr=new Date().getHours(),sau=hr<12?'Bom dia':hr<18?'Boa tarde':'Boa noite';return t.texto.split('{saudacao}').join(sau).split('{contato}').join(pessoa?' '+pessoa:'').split('{estabelecimento}').join(l.Estabelecimento||'').split('{eu}').join(ME||'')}
function tplBar(l){return '<div class="box" style="margin-top:0"><h3>Mensagem pronta</h3><div class="filters" style="margin:0"><select id="tplSel" onchange="tplPrev()">'+modelos().map(function(t,i){return '<option value="'+i+'">'+esc(t.nome)+'</option>'}).join('')+'</select>'+
  (l.WhatsApp||l.Telefone?'<button class="btn sm" onclick="tplWa()">📱 WhatsApp</button>':'')+'<button class="btn sm sec" onclick="tplCopy()">📋 Copiar'+(l.Instagram?' p/ Instagram':'')+'</button>'+(l['E-mail']?'<button class="btn sm sec" onclick="tplMail()">✉️ E-mail</button>':'')+'</div><div class="muted" id="tplPrev" style="margin-top:8px;white-space:pre-wrap">'+esc(tplTexto(l))+'</div><div class="muted" style="margin-top:4px;font-size:11px">Os modelos ficam na aba Config da planilha (colunas P e Q).</div></div>'}
function tplPrev(){var l=lead(OPEN);if(l)$('tplPrev').textContent=tplTexto(l)}
function tplWa(){var l=lead(OPEN);window.open(waLink(l.WhatsApp||l.Telefone,tplTexto(l)),'_blank')}
function tplCopy(){var l=lead(OPEN),t=tplTexto(l);var ok=function(){toast('Mensagem copiada'+(l.Instagram?' — abrindo o Instagram':''));if(l.Instagram)window.open(igLink(l.Instagram),'_blank')};
  try{navigator.clipboard.writeText(t).then(ok,function(){fallbackCopy(t);ok()})}catch(e){fallbackCopy(t);ok()}}
function fallbackCopy(t){var a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy')}catch(e){}a.remove()}
function tplMail(){var l=lead(OPEN),t=modelos().at(+$('tplSel').value)||modelos().at(0);window.open('mailto:'+encodeURIComponent(l['E-mail'])+'?subject='+encodeURIComponent('Morphê · '+t.nome)+'&body='+encodeURIComponent(tplTexto(l)),'_blank')}

// ---------------- TAREFAS
function tarefas(filtro){return D.atividades.filter(function(a){return a.Tipo==='Tarefa'&&(!filtro||filtro(a))})}
function tarefaLinha(a,mostraLead){var dp=days(a.Prazo),feita=a.Resultado==='Feita',l=a['Lead ID']?lead(a['Lead ID']):null;
  var tag=feita?'':(dp===null?'':dp>0?'<span class="tag red">atrasada '+dp+'d</span>':dp===0?'<span class="tag yel">hoje</span>':'<span class="tag gray">'+fmt(a.Prazo)+'</span>');
  return '<div class="brow" style="align-items:flex-start"><input type="checkbox" '+(feita?'checked':'')+' onchange="marcarTarefa(\''+a.ID+'\',this.checked)" style="margin-top:3px"><div style="flex:1'+(feita?';text-decoration:line-through;opacity:.6':'')+'"><div>'+esc(a.Texto)+' '+tag+'</div><div class="muted">'+esc(a['Menções']||'')+(mostraLead&&l?' · <a href="#" onclick="openLead(\''+l.ID+'\');return false">'+esc(l.Estabelecimento)+'</a>':'')+'</div></div></div>'}
function tarefasBox(l){var ts=tarefas(function(a){return a['Lead ID']===l.ID}).sort(function(a,b){return (a.Resultado==='Feita')-(b.Resultado==='Feita')||String(a.Prazo||'9').localeCompare(String(b.Prazo||'9'))});
  return '<div class="box"><h3>Tarefas</h3>'+(ts.length?ts.map(function(a){return tarefaLinha(a,false)}).join(''):'<div class="muted">Nenhuma tarefa.</div>')+
  '<div class="grid2" style="margin-top:8px"><label class="full">Nova tarefa<input id="tTxt" placeholder="ex.: mandar tabela de preços"></label><label>Prazo<input id="tPrazo" type="date" value="'+isoDay(new Date(Date.now()+864e5))+'"></label><label>Para quem<select id="tPes">'+opts(D.users.map(function(u){return u.nome}),ME)+'</select></label></div>'+
  '<div class="acts" style="margin-bottom:0"><button class="btn sm" onclick="novaTarefa()">+ Adicionar tarefa</button></div></div>'}
function novaTarefa(){var t=$('tTxt').value.trim();if(!t){toast('Escreva a tarefa');return}if(!ME){toast('Escolha seu nome no topo');return}
  call('addTask',{leadId:OPEN,texto:t,prazo:$('tPrazo').value,pessoa:$('tPes').value}).then(function(r){after(r);toast('Tarefa criada')})}
function marcarTarefa(id,feita){otimistaAtv(id,{Resultado:feita===false?'Aberta':'Feita'},function(){return callSilent('doneTask',id,feita)}).then(function(r){after(r);toast(feita?'Feita ✓':'Reaberta')})}
function cardTarefas(so){var ts=tarefas(function(a){return a.Resultado!=='Feita'&&(!so||a['Menções']===so)}).sort(function(a,b){return String(a.Prazo||'9').localeCompare(String(b.Prazo||'9'))});
  return '<div class="card"><h3>✅ '+(so?'Minhas tarefas':'Tarefas do time')+' ('+ts.length+')</h3>'+(ts.length?ts.slice(0,12).map(function(a){return tarefaLinha(a,true)}).join(''):'<div class="muted">Nenhuma tarefa aberta. Crie na ficha do lead.</div>')+'</div>'}

// ---------------- LEAD DO SITE: RESPOSTA EM 24 H
function slaSite(l){if(!/site|formul/i.test(l.Origem||'')||l['Último contato']||['Sugerido','Mapeado'].indexOf(l.Etapa)<0)return null;var c=d(l['Criado em']);if(!c)return null;return Math.max(0,Math.floor((Date.now()-c)/36e5))}
function cardSite(so){var ls=D.leads.filter(function(l){return slaSite(l)!==null&&(!so||l['Responsável']===so||!l['Responsável'])});if(!ls.length)return '';
  return '<div class="card" style="border-color:var(--verm)"><h3 style="color:var(--verm)">🌐 Site sem resposta ('+ls.length+')</h3><div class="muted" style="margin-bottom:8px">Quem preencheu o formulário do site deve ser respondido em até 24 h.</div>'+ls.map(card).join('')+'</div>'}

function semDono(){return D.leads.filter(function(l){return !l['Responsável']&&['Sugerido','Ganho','Perdido'].indexOf(l.Etapa)<0})}
function distribuirSemDono(){var ids=semDono().map(function(l){return l.ID});if(!ids.length)return;
  if(!confirm('Distribuir '+ids.length+' lead(s) sem dono em rodízio entre: '+(D.rodizio||[]).join(', ')+'?\n(A lista do rodízio fica na aba Config.)'))return;
  call('distribuir',ids).then(function(r){after(r);toast(ids.length+' lead(s) distribuídos')})}

function reativarFrio(id){if(!confirm('Reativar este lead? Ele volta para "Contato feito" e entra no funil ativo novamente.'))return;call('reativarLead',id).then(function(r){after(r);toast('Lead reativado 🔥');openLead(id)})}
function salvarLead(novo){var o={};if(!novo)o.ID=OPEN;document.querySelectorAll('#drawer [data-k]').forEach(function(el){o[el.dataset.k]=el.value});
  if(!o.Estabelecimento){toast('Informe o nome');return}call('saveLead',o).then(function(r){if(novo){var n=r.leads.filter(function(x){return x.Estabelecimento===o.Estabelecimento}).pop();OPEN=n?n.ID:null}after(r);toast('Salvo ✓')})}
function salvarAtv(){if(!ME){toast('Escolha seu nome no topo');return}var t=$('aTxt').value.trim(),tipo=$('aTipo').value;
  if(!t&&!$('aRes').value&&tipo==='Comentário'){toast('Escreva algo');return}
  call('addActivity',{leadId:OPEN,tipo:tipo,canal:tipo==='Contato'?$('aCanal').value:'',resultado:$('aRes').value,texto:t,proximoPasso:$('aProx').value,dataProx:$('aData').value,novaEtapa:$('aEt').value,motivo:$('aMot').value,mencoes:mentionsIn(t)}).then(function(r){$('aTxt').value='';$('aRes').value='';after(r);toast('Registrado ✓')})}

// ---------------- DASHBOARD
function inPeriod(s){if(!PERIOD)return true;var x=days(s);return x!==null&&x<=PERIOD}
function pct(a,b){return b?Math.round(a/b*100)+'%':'—'}
function bars(rows,max,cor){max=max||Math.max.apply(null,rows.map(function(r){return r[1]}).concat([1]));return rows.map(function(r){return '<div class="brow"><div class="lb">'+esc(r[0])+'</div><div style="flex:1"><div class="bar" style="width:'+Math.max(r[1]/max*100,4)+'%;background:'+(r[3]||cor||'var(--verde)')+'">'+r[1]+'</div></div><div class="rt">'+(r[2]||'')+'</div></div>'}).join('')}
function kpi(l,v,s,cor){return '<div class="card kpi"><div class="l">'+l+'</div><div class="v" style="'+(cor?'color:'+cor:'')+'">'+v+'</div><div class="s">'+(s||'')+'</div></div>'}

  var maxIdx={};L.forEach(function(l){maxIdx[l.ID]=ordem.indexOf(l.Etapa)});

  L.forEach(function(l){if(l.Etapa==='Perdido'&&maxIdx[l.ID]<1)maxIdx[l.ID]=1});
  var fun=ordem.map(function(e,i){var n=L.filter(function(l){return maxIdx[l.ID]>=i}).length;return [e,n]});
  fun=fun.map(function(r,i){return [r[0],r[1],i?pct(r[1],fun[i-1][1])+' da etapa anterior':'',COR[r[0]]]});

  var mig={};Object.keys(byLead).forEach(function(id){var arr=byLead[id];for(var i=1;i<arr.length;i++){if(arr[i].Canal&&arr[i-1].Canal&&arr[i].Canal!==arr[i-1].Canal){if(!inPeriod(arr[i].Data))continue;var k=arr[i-1].Canal+' → '+arr[i].Canal;mig[k]=mig[k]||{t:0,r:0};mig[k].t++;var resp=arr.slice(i).some(function(x){return x.Canal===arr[i].Canal&&RESPONDEU.indexOf(x.Resultado)>=0&&x.Resultado!=='Encaminhou para outro contato/canal'});if(resp)mig[k].r++;break}}});
  var migRows=Object.keys(mig).map(function(k){return [k,mig[k].t,mig[k].r]}).sort(function(a,b){return b[1]-a[1]});
  function grp(key){var g={};L.forEach(function(l){var k=l[key]||'(vazio)';g[k]=g[k]||{t:0,g:0,a:0};g[k].t++;if(l.Etapa==='Ganho')g[k].g++;if(maxIdx[l.ID]>=3)g[k].a++});return Object.keys(g).map(function(k){return [k,g[k].t,g[k].a+' amostras · '+g[k].g+' ganhos ('+pct(g[k].g,g[k].t)+')']}).sort(function(a,b){return b[1]-a[1]})}
  var pessoa=D.users.map(function(u){var c=C.filter(function(a){return a.Autor===u.nome}).length;var g=L.filter(function(l){return l['Responsável']===u.nome&&l.Etapa==='Ganho'}).length;return [u.nome,c,g+' ganhos']}).filter(function(r){return r[1]||r[2]!=='0 ganhos'});
  var mot={};L.filter(function(l){return l.Etapa==='Perdido'}).forEach(function(l){var k=l['Motivo de perda']||'(sem motivo)';mot[k]=(mot[k]||0)+1});

  var respTot=canalRows.reduce(function(s,r){return s+r[2]},0),contTot=canalRows.reduce(function(s,r){return s+r[1]},0);

  var etapaDias={};Object.keys(etapaHist).forEach(function(id){var arr=etapaHist[id];for(var i=0;i<arr.length-1;i++){var e=arr[i].etapa,diff=arr[i+1].dt-arr[i].dt;if(diff>0){etapaDias[e]=etapaDias[e]||{s:0,n:0};etapaDias[e].s+=diff/864e5;etapaDias[e].n++}}});
  var tempoRows=ordem.slice(0,-1).map(function(e){var t=etapaDias[e];return t&&t.n>0?[e,Math.round(t.s/t.n),Math.round(t.s/t.n)+'d médio ('+t.n+' obs.)']:null}).filter(Boolean);
  // #4 Dia da semana com mais respostas

  // #9 Leads sem contato há X dias
  var xSC=+(window._xSC||30);
  var semCont=D.leads.filter(ativo).map(function(l){var ds=diasSemContato(l);return {l:l,d:ds}}).filter(function(x){return x.d===null||x.d>=xSC}).sort(function(a,b){return (b.d===null?9999:b.d)-(a.d===null?9999:a.d)});
  // #11 Taxa de resposta por semana (últimas 8 semanas)
  var porSem={};D.atividades.filter(function(a){return a.Tipo==='Contato'&&inPeriod(a.Data)}).forEach(function(a){var dt=d(a.Data);if(!dt)return;var dow=dt.getDay();var seg=new Date(dt-dow*864e5+(dow===0?-6:1)*864e5);var sk=isoDay(seg);porSem[sk]=porSem[sk]||{c:0,r:0};porSem[sk].c++;if(RESPONDEU.indexOf(a.Resultado)>=0)porSem[sk].r++});
  var semRows=Object.keys(porSem).sort().slice(-8).map(function(s){var v=porSem[s];return [s.slice(5),v.c,pct(v.r,v.c)+' resp.']});
  // segmento por conversão (#5)
  var segConv={};L.forEach(function(l){var k=l.Segmento||'(vazio)';segConv[k]=segConv[k]||{t:0,g:0};segConv[k].t++;if(l.Etapa==='Ganho')segConv[k].g++});
  var segConvRows=Object.keys(segConv).filter(function(k){return segConv[k].t>=2}).map(function(k){var v=segConv[k];return [k,v.g,pct(v.g,v.t)+' ('+v.g+'/'+v.t+')']}).sort(function(a,b){return (b[0]===0?0:b[1]/segConv[b[0]].t)-(a[0]===0?0:a[1]/segConv[a[0]].t)});
  var maxSegConv=Math.max.apply(null,segConvRows.map(function(r){return r[1]}).concat([1]));

  $('main').innerHTML='<div class="filters"><h2 style="margin:0">Dashboard comercial</h2><button class="btn sec sm" onclick="enviarResumo()">📧 Receber o resumo semanal agora</button><select style="margin-left:auto" onchange="PERIOD=+this.value;render()">'+[[30,'Últimos 30 dias'],[90,'Últimos 90 dias'],[0,'Tudo']].map(function(p){return '<option value="'+p[0]+'"'+(PERIOD===p[0]?' selected':'')+'>'+p[1]+'</option>'}).join('')+'</select></div>'+
  // KPIs
  '<div class="row">'+
   kpi('Leads no funil',ativos,'em andamento agora')+
   kpi('Contatos na semana',sem,'meta: '+D.metaContatosSemana)+
   kpi('Taxa de resposta geral',pct(respTot,contTot),respTot+' de '+contTot+' leads contatados')+
   kpi('Amostras enviadas',amostras,pct(amostras,L.length)+' dos leads')+
   kpi('Novos clientes',ganhos,'conversão '+pct(ganhos,L.length)+' · meta/mês: '+D.metaGanhosMes)+
   kpi('Tempo até fechar',tempo.length?Math.round(tempo.reduce(function(a,b){return a+b},0)/tempo.length)+' dias':'—','média, da entrada ao ganho')+
   kpi('Sem contato há 30d+',semCont.length,'leads ativos sem contato recente',semCont.length>5?'var(--verm)':'')+'</div>'+
  // Funil + Canal
  '<div class="row" style="margin-top:14px;align-items:flex-start">'+
   '<div class="card" style="flex:1;min-width:340px"><h3>Funil de conversão — taxa por etapa</h3>'+bars(fun)+'<div class="muted">Perdidos no período: '+perd+'</div></div>'+
   '<div class="card" style="flex:1;min-width:340px"><h3>Taxa de resposta por canal</h3>'+(canalRows.length?canalRows.map(function(r){return '<div class="brow"><div class="lb">'+esc(r[0])+'</div><div style="flex:1;background:#F4EBDA;border-radius:6px"><div class="bar" style="width:'+Math.max(r[2]/Math.max(r[1],1)*100,6)+'%;background:var(--verde2)">'+pct(r[2],r[1])+'</div></div><div class="rt">'+r[2]+' de '+r[1]+' leads</div></div>'}).join(''):'<div class="muted">Sem contatos no período.</div>')+
   '<h3 style="margin-top:16px">Quando muda de canal</h3>'+(migRows.length?migRows.map(function(r){return '<div class="brow"><div class="lb">'+esc(r[0])+'</div><div style="flex:1;background:#F4EBDA;border-radius:6px"><div class="bar" style="width:'+Math.max(r[2]/Math.max(r[1],1)*100,6)+'%;background:var(--laranja)">'+pct(r[2],r[1])+'</div></div><div class="rt">'+r[2]+' de '+r[1]+' responderam</div></div>'}).join(''):'<div class="muted">Nenhuma troca de canal.</div>')+'</div></div>'+
  // Tempo médio por etapa + Dia da semana
  '<div class="row" style="margin-top:14px;align-items:flex-start">'+
   '<div class="card" style="flex:1;min-width:320px"><h3>⏱ Tempo médio em cada etapa</h3>'+(tempoRows.length?bars(tempoRows,Math.max.apply(null,tempoRows.map(function(r){return r[1]})),'var(--azul)'):'<div class="muted">Sem histórico suficiente de mudanças de etapa ainda.</div>')+'</div>'+
   '<div class="card" style="flex:1;min-width:320px"><h3>📅 Quando recebemos respostas (dia da semana)</h3>'+bars(diaRows,Math.max.apply(null,porDia.concat([1])),'var(--lima)')+'</div></div>'+
  // Segmento conversão + Cidades
  '<div class="row" style="margin-top:14px;align-items:flex-start">'+
   '<div class="card" style="flex:1;min-width:320px"><h3>🏆 Segmentos com melhor conversão</h3>'+(segConvRows.length?segConvRows.map(function(r){return '<div class="brow"><div class="lb">'+esc(r[0])+'</div><div style="flex:1"><div class="bar" style="width:'+Math.max(r[1]/maxSegConv*100,4)+'%;background:var(--lima)">'+r[1]+'</div></div><div class="rt">'+r[2]+'</div></div>'}).join(''):'<div class="muted">Sem dados.</div>')+'</div>'+
   '<div class="card" style="flex:1;min-width:320px"><h3>📍 Top cidades com leads ativos</h3>'+bars(cidadeRows,0,'var(--azul)')+'</div></div>'+
  // Origem + Semana
  '<div class="row" style="margin-top:14px;align-items:flex-start">'+
   '<div class="card" style="flex:1;min-width:320px"><h3>Por origem</h3>'+bars(grp('Origem'),0,'var(--azul)')+'</div>'+
   '<div class="card" style="flex:1;min-width:320px"><h3>📈 Taxa de resposta por semana</h3>'+(semRows.length?bars(semRows,Math.max.apply(null,semRows.map(function(r){return r[1]}).concat([1])),'var(--verde2)'):'<div class="muted">Sem dados.</div>')+'</div></div>'+
  // Pessoas + Motivos
  '<div class="row" style="margin-top:14px;align-items:flex-start">'+
   '<div class="card" style="flex:1;min-width:320px"><h3>Contatos por pessoa</h3>'+bars(pessoa,0,'var(--verde)')+'</div>'+
   '<div class="card" style="flex:1;min-width:320px"><h3>Motivos de perda</h3>'+(motRows.length?bars(motRows,0,'var(--verm)'):'<div class="muted">Nenhum.</div>')+'</div></div>'+
  // Leads sem contato há X dias (#9)
  '<div class="card" style="margin-top:14px"><h3>🔔 Leads sem contato recente</h3>'+
  '<div class="filters" style="margin-bottom:8px"><span class="muted">Sem contato há mais de </span><select style="width:80px" onchange="window._xSC=+this.value;vDash()">'+[14,21,30,45,60].map(function(n){return '<option'+(xSC===n?' selected':'')+' value="'+n+'">'+n+'d</option>'}).join('')+'</select><span class="muted"> ('+semCont.length+' leads)</span></div>'+
  (semCont.length?'<div style="overflow:auto"><table><tr><th>Estabelecimento</th><th>Responsável</th><th>Etapa</th><th>Dias s/contato</th><th></th></tr>'+semCont.slice(0,20).map(function(x){return '<tr class="click" onclick="openLead(\''+x.l.ID+'\')"><td><b>'+esc(x.l.Estabelecimento)+'</b></td><td>'+esc(x.l['Responsável']||'—')+'</td><td>'+esc(x.l.Etapa)+'</td><td><span class="tag '+(x.d>30?'red':x.d>14?'yel':'gray')+'">'+( x.d===null?'nunca contactado':x.d+'d')+'</span></td><td><a href="#" class="muted" onclick="openLead(\''+x.l.ID+'\');return false">abrir</a></td></tr>'}).join('')+'</table></div>'+'<div class="muted" style="margin-top:6px">'+(semCont.length>20?'Mostrando 20 de '+semCont.length+'. Filtre por etapa na aba Leads para ver todos.':'')+'</div>':'<div class="muted">Todos os leads ativos tiveram contato recente. 🎉</div>')+'</div>'}

function followUpPV(id){
  var l=lead(id);if(!l)return;
  var dr=$('drawer');
  var canais=['WhatsApp','Instagram','E-mail','Ligação','Visita','Outro'];
  var vendas=['Ótimas — vendeu muito bem','Boas — saindo bem','Regulares — saindo devagar','Fracas — quase não vendeu','Não vendeu nada','Não souberam dizer'];
  var estoques=['Sim, tem bastante','Sim, mas está acabando','Não, zerou','Não soube informar'];
  var interesses=['Sim — quer pedir agora','Sim — mas ainda tem estoque','Talvez — vai retornar','Não agora','Não quer mais'];
  dr.innerHTML='<div class="top"><h2>📋 Follow-up pós-venda</h2><div style="font-size:12px;opacity:.85">'+esc(l.Estabelecimento)+' · '+esc(l.Segmento||'')+'</div></div>'+
  '<div class="body"><p class="muted" style="margin:0 0 12px">Preencha após o contato com o cliente. Essas respostas ficam salvas no histórico e ajudam a decidir próximos passos.</p>'+
  '<label>Canal do contato<select id="pvCanal">'+canais.map(function(c){return'<option>'+c+'</option>'}).join('')+'</select></label>'+
  '<h3 style="margin:16px 0 8px;color:var(--verde)">Perguntas guiadas</h3>'+
  '<label>📊 Como foram as vendas do produto desde o último pedido?<select id="pvVendas"><option value="">Selecione</option>'+vendas.map(function(v){return'<option>'+v+'</option>'}).join('')+'</select></label>'+
  '<label>📦 Ainda tem produto em estoque?<select id="pvEstoque"><option value="">Selecione</option>'+estoques.map(function(v){return'<option>'+v+'</option>'}).join('')+'</select></label>'+
  '<label>🔄 Interesse em novo pedido?<select id="pvInteresse" onchange="pvInteresseMudou()"><option value="">Selecione</option>'+interesses.map(function(v){return'<option>'+v+'</option>'}).join('')+'</select></label>'+
  '<div id="pvMotDiv" style="display:none"><label>⚠️ Motivo da queda / não recompra (opcional)<input id="pvMotivo" placeholder="ex.: temporada baixa, caixa curto, produto encalhado..."></label></div>'+
  '<label>💬 Observações livres / feedback do cliente<textarea id="pvObs" rows="3" placeholder="ex.: adoraram o sabor, mas querem formato em cubos; pediram desconto; esperam retorno do chef..."></textarea></label>'+
  '<h3 style="margin:16px 0 8px;color:var(--verde)">Próximo passo</h3>'+
  '<div class="grid2"><label class="full">O que fazer<input id="pvProx" placeholder="ex.: enviar proposta de pedido, ligar em 2 semanas, aguardar resposta do chef..."></label>'+
  '<label>Quando<input id="pvData" type="date" value="'+isoDay(new Date(Date.now()+7*864e5))+'"></label></div>'+
  '<div style="display:flex;gap:8px;margin-top:14px"><button class="btn" onclick="salvarFollowUpPV(\''+id+'\')">Salvar follow-up</button><button class="btn sec" onclick="closeDrawer()">Cancelar</button></div></div>';
  dr.classList.add('open');$('ov').classList.add('open');
}
function pvInteresseMudou(){
  var v=$('pvInteresse').value;
  $('pvMotDiv').style.display=(!v||v.indexOf('Sim')===0)?'none':'block';
}
function salvarFollowUpPV(id){
  var canal=$('pvCanal').value;
  var vendas=$('pvVendas').value;
  var estoque=$('pvEstoque').value;
  var interesse=$('pvInteresse').value;
  var motivo=$('pvMotivo')?$('pvMotivo').value:'';
  var obs=$('pvObs').value.trim();
  var prox=$('pvProx').value.trim();
  var data=$('pvData').value;
  var linhas=[];
  if(vendas)linhas.push('📊 Vendas: '+vendas);
  if(estoque)linhas.push('📦 Estoque: '+estoque);
  if(interesse)linhas.push('🔄 Interesse em repor: '+interesse);
  if(motivo)linhas.push('⚠️ Motivo da queda/não recompra: '+motivo);
  if(obs)linhas.push('💬 '+obs);
  var texto='[Follow-up pós-venda]\n'+linhas.join('\n');
  var resultado=interesse.indexOf('Sim — quer pedir')===0?'Interessado':interesse.indexOf('Sim — mas')===0?'Pediu para retornar depois':interesse.indexOf('Talvez')===0?'Pediu para retornar depois':interesse.indexOf('Não')===0?'Não tem interesse':'Não respondeu';
  if(!canal){toast('Escolha o canal');return;}
  OPEN=null;
  call('addActivity',{leadId:id,tipo:'Contato',canal:canal,resultado:resultado,texto:texto,proximoPasso:prox||undefined,dataProx:data||undefined}).then(function(r){after(r);closeDrawer();toast('Follow-up registrado ✓');go('posVenda')});
}

function vPosVenda(){
  var so=F.pvTodos?'':ME;
  var clientes=D.leads.filter(function(l){return l.Etapa==='Ganho'&&(!so||l['Responsável']===so)});
  clientes=clientes.map(function(l){
    var ds=diasSemContato(l);var vp=days(l['Data próximo passo']);
    var urg=0;
    if(vp!==null&&vp>0)urg=100+vp;
    else if(ds===null)urg=90;
    else if(ds>=30)urg=80+Math.min(ds,50);
    else if(ds>=14)urg=60+ds;
    else urg=ds||0;
    return{l:l,ds:ds,vp:vp,urg:urg};
  }).sort(function(a,b){return b.urg-a.urg});
  var urgentes=clientes.filter(function(x){return x.urg>=60});
  var semCont30=clientes.filter(function(x){return x.ds===null||x.ds>=30});
  var vencidos=clientes.filter(function(x){return x.vp!==null&&x.vp>0});
  function tagDs(x){if(x.ds===null)return'<span class="tag red">nunca contactado</span>';if(x.ds>30)return'<span class="tag red">'+x.ds+'d</span>';if(x.ds>14)return'<span class="tag yel">'+x.ds+'d</span>';return'<span class="tag gray">'+x.ds+'d</span>';}
  function tagVp(x){if(x.vp===null)return'<span class="tag gray">—</span>';if(x.vp>0)return'<span class="tag red">'+x.vp+'d de atraso</span>';if(x.vp===0)return'<span class="tag yel">hoje</span>';return'<span class="tag">em '+(-x.vp)+'d</span>';}
  function row(x){var l=x.l;return'<tr><td class="click" onclick="openLead(\''+l.ID+'\')"><b>'+esc(l.Estabelecimento)+'</b><div class="muted">'+esc([l.Segmento,l.Cidade].filter(String).join(' · '))+'</div></td><td>'+esc(l['Responsável']||'—')+'</td><td>'+tagDs(x)+'</td><td style="max-width:180px">'+esc(l['Próximo passo']||'—')+'</td><td>'+tagVp(x)+'</td><td><button class="btn sm" onclick="followUpPV(\''+l.ID+'\')">📋 Follow-up</button>'+(l.WhatsApp?'<a href="'+waLink(l.WhatsApp)+'" target="_blank" class="btn sm sec" style="margin-left:4px">📱</a>':'')+'</td></tr>';}
  $('main').innerHTML='<div class="filters"><h2 style="margin:0">Pós-venda — acompanhamento de clientes</h2><label class="muted" style="margin-left:auto"><input type="checkbox" '+(F.pvTodos?'checked':'')+' onchange="F.pvTodos=this.checked;render()"> ver o time todo</label></div>'+
  '<div class="row">'+
  '<div class="card kpi"><div class="l">Clientes ativos</div><div class="v">'+clientes.length+'</div><div class="s">status Ganho</div></div>'+
  '<div class="card kpi"><div class="l">Atenção urgente</div><div class="v" style="color:var(--verm)">'+urgentes.length+'</div><div class="s">14d+ sem contato ou atrasado</div></div>'+
  '<div class="card kpi"><div class="l">Sem contato 30d+</div><div class="v" style="color:var(--verm)">'+semCont30.length+'</div><div class="s">risco de churn</div></div>'+
  '<div class="card kpi"><div class="l">Follow-ups vencidos</div><div class="v" style="color:var(--laranja)">'+vencidos.length+'</div><div class="s">próximo passo atrasado</div></div>'+
  '</div>'+
  '<div class="card" style="margin-top:14px"><h3>🔥 Prioritários — contate agora</h3>'+
  (urgentes.length?'<div class="sug">'+urgentes.slice(0,8).map(function(x){var l=x.l;return'<div class="card"><div style="font-weight:700;font-size:15px">'+esc(l.Estabelecimento)+'</div><div class="muted">'+esc([l.Segmento,l.Cidade].filter(String).join(' · '))+'</div><div style="margin:6px 0;display:flex;gap:6px;flex-wrap:wrap">'+tagDs(x)+tagVp(x)+'</div><div class="muted" style="margin-bottom:8px">'+esc(l['Próximo passo']||'Sem próximo passo definido')+'</div><div class="acts"><button class="btn sm" onclick="followUpPV(\''+l.ID+'\')">📋 Registrar follow-up</button>'+(l.WhatsApp?'<a href="'+waLink(l.WhatsApp)+'" target="_blank" class="btn sm sec">📱 WhatsApp</a>':'')+(l.Instagram?'<a href="'+igLink(l.Instagram)+'" target="_blank" class="btn sm sec">📷 Instagram</a>':'')+'</div></div>'}).join('')+'</div>':'<div class="muted">Nenhum urgente no momento. 🎉</div>')+'</div>'+
  '<div class="card" style="margin-top:14px"><h3>Lista completa · ordenado por urgência</h3>'+
  (clientes.length?'<div style="overflow:auto"><table><tr><th>Cliente</th><th>Resp.</th><th>Último contato</th><th>Próximo passo</th><th>Data/prazo</th><th></th></tr>'+clientes.map(row).join('')+'</table></div>':'<div class="muted">Nenhum cliente ainda. Quando um lead chega em Ganho, aparece aqui automaticamente.</div>')+'</div>';
}

document.addEventListener('keydown',function(e){if(e.key==='Escape')closeDrawer()});
load();
</script>
</body>
</html>
